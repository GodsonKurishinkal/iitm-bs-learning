<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation Flashcards — Maths 1 &amp; 2, Stats 1 &amp; 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F1F1; --card:#FFFFFF; --ink:#111111; --ink2:#3C3C3C;
  --muted:#767676; --rule:#CDCDCD;
  --blue:#1A1A1A; --blue-t:#ECECEC; --blue-b:#C2C2C2;
  --ox:#616161; --ox-t:#E3E3E3; --ox-b:#BCBCBC;
  --green:#2B2B2B; --green-t:#E8E8E8; --green-b:#C6C6C6;
  --accent-ink:#111111; --on-accent:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F0F0F; --card:#1B1B1B; --ink:#EDEDED; --ink2:#B6B6B6;
    --muted:#8A8A8A; --rule:#333333;
    --blue:#E2E2E2; --blue-t:#262626; --blue-b:#464646;
    --ox:#A6A6A6; --ox-t:#212121; --ox-b:#3C3C3C;
    --green:#F2F2F2; --green-t:#2A2A2A; --green-b:#4E4E4E;
    --on-accent:#111111;
  }
}
:root[data-theme="dark"]{
  --paper:#0F0F0F; --card:#1B1B1B; --ink:#EDEDED; --ink2:#B6B6B6;
  --muted:#8A8A8A; --rule:#333333;
  --blue:#E2E2E2; --blue-t:#262626; --blue-b:#464646;
  --ox:#A6A6A6; --ox-t:#212121; --ox-b:#3C3C3C;
  --green:#F2F2F2; --green-t:#2A2A2A; --green-b:#4E4E4E;
  --on-accent:#111111;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.6;
}
h1,h2,h3,button,select,.mono{font-family:Archivo,system-ui,sans-serif}

/* ── bar ── */
.bar{position:sticky;top:0;z-index:50;background:var(--accent-ink);border-bottom:2px solid var(--blue)}
.bar-in{
  max-width:860px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:12px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
}
.bar-in .brand{font-weight:600;color:#fff;margin-right:auto;letter-spacing:.14em;text-decoration:none}
.bar-in a.ref{color:#B4B4B4;text-decoration:none;padding:3px 7px;border:1px solid #444444;border-radius:2px}
.bar-in a.ref:hover{color:#fff}
.tbtn{background:none;border:1px solid #444444;border-radius:2px;cursor:pointer;font-size:13px;padding:2px 7px;filter:grayscale(1)}

.shell{max-width:860px;margin:0 auto;padding:22px 20px 90px}

/* ── controls ── */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select{
  font-size:13px;font-weight:600;padding:8px 11px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);border-radius:2px;cursor:pointer;
}
select:focus{outline:none;border-color:var(--blue)}
.spacer{margin-left:auto}

/* ── progress ── */
.prog-wrap{margin-bottom:20px}
.prog-top{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);
}
.prog-top b{font-family:Archivo,sans-serif;font-size:15px;color:var(--ink);letter-spacing:0}
.prog{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);width:0;transition:width .3s ease}

/* ── card ── */
.card{
  background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--blue);
  padding:26px 26px 24px;min-height:290px;display:flex;flex-direction:column;cursor:pointer;
  position:relative;
}
.card:hover{border-color:var(--blue-b)}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.badge{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;color:var(--blue);background:var(--blue-t);border:1px solid var(--blue-b);padding:3px 7px;
}
.clause{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.known-dot{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--green);letter-spacing:.1em}
.front{font-size:21px;font-weight:600;line-height:1.4;letter-spacing:-.01em;margin:0}
.divider{height:1px;background:var(--rule);margin:20px 0 18px}
.back{
  font-family:"IBM Plex Mono",monospace;font-size:15.5px;line-height:1.65;
  white-space:pre-wrap;color:var(--ink);margin:0;word-break:break-word;
}
.hint{
  position:absolute;bottom:16px;left:0;right:0;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;
}

/* ── actions ── */
.actions{display:flex;gap:9px;margin-top:14px}
.btn{
  flex:1;font-size:14px;font-weight:600;padding:13px;border-radius:2px;cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);
}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-again{border-color:var(--ox-b);color:var(--ox);background:var(--ox-t)}
.btn-again:hover{border-color:var(--ox);color:var(--ox)}
.btn-got{border-color:var(--green-b);color:var(--green);background:var(--green-t)}
.btn-got:hover{border-color:var(--green);color:var(--green)}
.btn-flip{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn-flip:hover{opacity:.85;color:var(--on-accent)}

.nav{display:flex;gap:9px;margin-top:9px;align-items:center}
.nav .btn{flex:none;padding:9px 15px;font-size:13px}
.counter{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
  letter-spacing:.06em;
}

/* ── keys + empty ── */
.keys{
  margin-top:22px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--muted);letter-spacing:.04em;line-height:1.9;
}
kbd{
  background:var(--blue-t);border:1px solid var(--blue-b);padding:1px 6px;
  border-radius:2px;color:var(--blue);font-size:10.5px;font-weight:600;
}
.done{
  background:var(--green-t);border:1px solid var(--green-b);border-top:3px solid var(--green);
  padding:40px 26px;text-align:center;
}
.done h2{margin:0 0 8px;font-size:22px;color:var(--green)}
.done p{margin:0 0 18px;color:var(--ink2);font-size:15px}
@media (max-width:560px){
  .front{font-size:18px}.back{font-size:14px}
  .card{padding:20px 18px 22px;min-height:250px}
  .spacer{margin-left:0;width:100%}
}
</style>
</head>
<body>

<nav class="bar">
  <div class="bar-in">
    <span class="brand">Foundation Flashcards</span>
    <a class="ref" href="Foundation-Theory-Handbook.html">Handbook</a>
    <button class="tbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">☀️</button>
  </div>
</nav>

<main class="shell">

  <div class="controls">
    <select id="course" aria-label="Filter by course">
      <option value="ALL">All four courses</option>
      <option value="M1">Mathematics I</option>
      <option value="S1">Statistics I</option>
      <option value="M2">Mathematics II</option>
      <option value="S2">Statistics II</option>
      <option value="AP">Appendix</option>
    </select>
    <select id="clause" aria-label="Filter by clause"></select>
    <select id="mode" aria-label="Which cards to study">
      <option value="new">Not yet known</option>
      <option value="all">Every card</option>
      <option value="known">Known only</option>
    </select>
    <button class="btn spacer" id="shuffle" style="flex:none;padding:8px 13px;font-size:13px">Shuffle</button>
    <button class="btn" id="reset" style="flex:none;padding:8px 13px;font-size:13px">Reset</button>
  </div>

  <div class="prog-wrap">
    <div class="prog-top"><span id="progLabel">progress</span><b id="progPct">0%</b></div>
    <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div id="stage"></div>

  <div class="keys">
    <kbd>space</kbd> flip &nbsp;·&nbsp; <kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp;
    <kbd>1</kbd> again &nbsp;·&nbsp; <kbd>2</kbd> got it &nbsp;·&nbsp; <kbd>s</kbd> shuffle
  </div>
</main>

<script>
const CARDS =[{"i":"M1.01.c01","c":"M1.01","k":"M1","y":1,"t":"CLASSIFY","f":"Which set is NOT closed under division (by a non-zero element)?","b":"ℤ (integers)"},{"i":"M1.01.c02","c":"M1.01","k":"M1","y":1,"t":"CLASSIFY","f":"ℝ is extended to ℂ because ℝ fails at…","b":"√−1"},{"i":"M1.01.t01","c":"M1.01","k":"M1","y":1,"t":"TRAP","f":"ℤ is a field.","b":"FALSE — it lacks multiplicative inverses"},{"i":"M1.01.t02","c":"M1.01","k":"M1","y":1,"t":"TRAP","f":"ℂ is an ordered field.","b":"FALSE — ℂ cannot be ordered compatibly with its arithmetic"},{"i":"M1.01.c03","c":"M1.01","k":"M1","y":1,"t":"CLASSIFY","f":"p/q in lowest terms has a terminating decimal expansion exactly when q has only which prime factors?","b":"2 and 5"},{"i":"M1.01.t03","c":"M1.01","k":"M1","y":1,"t":"TRAP","f":"1 is a prime number.","b":"FALSE — 1 is neither prime nor composite"},{"i":"M1.01.f01","c":"M1.01","k":"M1","y":1,"t":"FORMULA","f":"Number of positive divisors of n = p₁^a₁ ⋯ p_k^a_k","b":"prod(ai+1)"},{"i":"M1.01.f02","c":"M1.01","k":"M1","y":1,"t":"FORMULA","f":"Relation between gcd, lcm and the product of a and b","b":"gcd(a,b)*lcm(a,b)=ab"},{"i":"M1.01.f03","c":"M1.01","k":"M1","y":1,"t":"FORMULA","f":"For z = a + ib, write |z| in terms of a and b","b":"sqrt(a^2+b^2)"},{"i":"M1.01.f04","c":"M1.01","k":"M1","y":1,"t":"FORMULA","f":"Express z⁻¹ using the conjugate and modulus of z","b":"conj(z)/|z|^2"},{"i":"M1.01.d01","c":"M1.01","k":"M1","y":1,"t":"DERIVE","f":"√2 is irrational — state the key move of the contradiction proof.","b":"p^2=2q^2 so p even, p=2k gives q even, contradicting gcd(p,q)=1"},{"i":"M1.02.f01","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Size of the power set of A, where |A| = n","b":"2^n"},{"i":"M1.02.f02","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Inclusion–exclusion for two sets: |A ∪ B| = ?","b":"|A|+|B|-|A∩B|"},{"i":"M1.02.f03","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Inclusion–exclusion for three sets: |A ∪ B ∪ C| = ?","b":"|A|+|B|+|C|-|A∩B|-|A∩C|-|B∩C|+|A∩B∩C|"},{"i":"M1.02.f04","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"De Morgan: (A ∪ B)ᶜ = ?","b":"A^c∩B^c"},{"i":"M1.02.f05","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Set difference A \\ B written using complement and intersection","b":"A∩B^c"},{"i":"M1.02.f06","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Symmetric difference A △ B in terms of unions and intersections","b":"(A∪B)\\(A∩B)"},{"i":"M1.02.t01","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"{1} ∈ {1, 2}","b":"FALSE — {1} is a subset, not an element, of {1,2}"},{"i":"M1.02.t02","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"∅ and {∅} are the same set.","b":"FALSE — {∅} has one element; ∅ has none"},{"i":"M1.02.t03","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"An infinite set can be in bijection with a proper subset of itself.","b":"TRUE — that is precisely the definition of infinite"},{"i":"M1.02.c01","c":"M1.02","k":"M1","y":2,"t":"CLASSIFY","f":"Which set is uncountable?","b":"ℝ"},{"i":"M1.02.c02","c":"M1.02","k":"M1","y":2,"t":"CLASSIFY","f":"Cantor’s diagonal argument establishes that…","b":"ℝ is uncountable"},{"i":"M1.02.f07","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"|A × B| in terms of |A| and |B|","b":"|A||B|"},{"i":"M1.02.d01","c":"M1.02","k":"M1","y":2,"t":"DERIVE","f":"Russell’s collection R = {X : X ∉ X} — state the contradiction it produces.","b":"R∈R iff R∉R"},{"i":"M1.03.f01","c":"M1.03","k":"M1","y":1,"t":"FORMULA","f":"Number of relations on a set A with |A| = n","b":"2^(n^2)"},{"i":"M1.03.c01","c":"M1.03","k":"M1","y":1,"t":"CLASSIFY","f":"Reflexive + symmetric + transitive defines a…","b":"equivalence relation"},{"i":"M1.03.c02","c":"M1.03","k":"M1","y":1,"t":"CLASSIFY","f":"Reflexive + antisymmetric + transitive defines a…","b":"partial order"},{"i":"M1.03.dsc01","c":"M1.03","k":"M1","y":1,"t":"DISCRIM","f":"Symmetric  ⟷  Antisymmetric","b":"Symmetric\n• aRb ⇒ bRa\n• “is a sibling of”\n• Equivalence relations require it\n\nAntisymmetric\n• aRb ∧ bRa ⇒ a = b\n• “is less than or equal to”\n• Partial orders require it"},{"i":"M1.03.t01","c":"M1.03","k":"M1","y":1,"t":"TRAP","f":"The equivalence classes of an equivalence relation on A partition A.","b":"TRUE — they are non-empty, pairwise disjoint, and cover A"},{"i":"M1.04.f01","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of functions A → B where |A| = m, |B| = n","b":"n^m"},{"i":"M1.04.f02","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of injective functions A → B, |A| = m, |B| = n","b":"n(n-1)...(n-m+1)"},{"i":"M1.04.f03","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of surjective functions A → B, |A| = m, |B| = n","b":"sum_{k=0}^{n}(-1)^k C(n,k)(n-k)^m"},{"i":"M1.04.f04","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Inverse of a composition: (g ∘ f)⁻¹ = ?","b":"f^-1∘g^-1"},{"i":"M1.04.c01","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"f⁻¹ exists exactly when f is…","b":"a bijection"},{"i":"M1.04.c02","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"The graph of f⁻¹ is the graph of f reflected in which line?","b":"y = x"},{"i":"M1.04.c03","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"f(−x) = −f(x) describes a function that is…","b":"odd, symmetric about the origin"},{"i":"M1.04.dsc01","c":"M1.04","k":"M1","y":2,"t":"DISCRIM","f":"Injective (one-one)  ⟷  Surjective (onto)","b":"Injective (one-one)\n• f(x₁)=f(x₂) ⇒ x₁=x₂\n• Horizontal line meets graph at most once\n• A strictly monotone function is automatically this\n\nSurjective (onto)\n• f(A) = B\n• Every element of the codomain is hit\n• Requires the image to fill the codomain"},{"i":"M1.04.ch01","c":"M1.04","k":"M1","y":2,"t":"CHAIN","f":"Transformations of y = f(x): order these from the graph of f to the graph of a·f(x + k) + c","b":"1. Shift left by k: f(x + k)\n2. Stretch vertically by a: a·f(x + k)\n3. Shift up by c: a·f(x + k) + c"},{"i":"M1.04.t01","c":"M1.04","k":"M1","y":2,"t":"TRAP","f":"Composition of functions is commutative.","b":"FALSE — g∘f ≠ f∘g in general; composition is associative but not commutative"},{"i":"M1.05.f01","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Distance between (x₁,y₁) and (x₂,y₂)","b":"sqrt((x2-x1)^2+(y2-y1)^2)"},{"i":"M1.05.f02","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Internal section formula, ratio m:n — the point is…","b":"((m x2+n x1)/(m+n),(m y2+n y1)/(m+n))"},{"i":"M1.05.f03","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"External section formula, ratio m:n","b":"((m x2-n x1)/(m-n),(m y2-n y1)/(m-n))"},{"i":"M1.05.f04","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Centroid of a triangle with vertices (xᵢ,yᵢ)","b":"((x1+x2+x3)/3,(y1+y2+y3)/3)"},{"i":"M1.05.f05","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Area of a triangle from three vertices","b":"(1/2)|x1(y2-y3)+x2(y3-y1)+x3(y1-y2)|"},{"i":"M1.05.co01","c":"M1.05","k":"M1","y":2,"t":"CONDITION","f":"Area of a triangle computed as ½[x₁(y₂−y₃)+x₂(y₃−y₁)+x₃(y₁−y₂)], answer left negative.","b":"REJECT — the modulus must be taken — area is non-negative"},{"i":"M1.05.co02","c":"M1.05","k":"M1","y":2,"t":"CONDITION","f":"Section formula, ratio m:n — m is attached to the point (x₁,y₁).","b":"REJECT — m attaches to the far point (x₂,y₂)"},{"i":"M1.05.c01","c":"M1.05","k":"M1","y":2,"t":"CLASSIFY","f":"Three points are collinear exactly when the triangle area Δ equals…","b":"0"},{"i":"M1.06.f01","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Slope from two points, and its trigonometric meaning","b":"m=(y2-y1)/(x2-x1)=tan(theta)"},{"i":"M1.06.f02","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Point–slope form of a line","b":"y-y1=m(x-x1)"},{"i":"M1.06.f03","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Two-point form of a line","b":"y-y1=((y2-y1)/(x2-x1))(x-x1)"},{"i":"M1.06.f04","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Slope–intercept form of a line","b":"y=mx+c"},{"i":"M1.06.f05","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Intercept form of a line","b":"x/a+y/b=1"},{"i":"M1.06.f06","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Normal form of a line (perpendicular distance p from the origin)","b":"x cos(alpha)+y sin(alpha)=p"},{"i":"M1.06.f07","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"General form of a line","b":"Ax+By+C=0"},{"i":"M1.06.f08","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"From Ax + By + C = 0, read off the slope m","b":"-A/B"},{"i":"M1.06.f09","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"From Ax + By + C = 0, give the x-intercept and the y-intercept","b":"x-int=-C/A, y-int=-C/B"},{"i":"M1.06.f10","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Perpendicular distance from (x₀,y₀) to Ax + By + C = 0","b":"|A x0+B y0+C|/sqrt(A^2+B^2)"},{"i":"M1.06.f11","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Distance between the parallels Ax + By + C₁ = 0 and Ax + By + C₂ = 0","b":"|C1-C2|/sqrt(A^2+B^2)"},{"i":"M1.06.f12","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Angle between two lines with slopes m₁ and m₂","b":"tan(theta)=|(m1-m2)/(1+m1 m2)|"},{"i":"M1.06.f13","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Line through (x₁,y₁) perpendicular to Ax + By + C = 0","b":"B(x-x1)-A(y-y1)=0"},{"i":"M1.06.c01","c":"M1.06","k":"M1","y":3,"t":"CLASSIFY","f":"Two non-vertical lines are perpendicular exactly when…","b":"m₁m₂ = −1"},{"i":"M1.06.c02","c":"M1.06","k":"M1","y":3,"t":"CLASSIFY","f":"A₁x+B₁y+C₁=0 and A₂x+B₂y+C₂=0 are parallel (not identical) when…","b":"A₁/A₂ = B₁/B₂ ≠ C₁/C₂"},{"i":"M1.06.co01","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Apply the point-to-line distance formula directly to the line written as y = 3x + 2.","b":"REJECT — rewrite in general form with everything on one side first"},{"i":"M1.06.co02","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Use d = |C₁−C₂|/√(A²+B²) for 2x + 3y + 1 = 0 and 4x + 6y + 7 = 0.","b":"REJECT — A and B must be identical — rescale one equation first"},{"i":"M1.06.co03","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Use m₁m₂ = −1 to test perpendicularity when one of the lines is vertical.","b":"REJECT — the slope of a vertical line is undefined — handle that case separately"},{"i":"M1.06.t01","c":"M1.06","k":"M1","y":3,"t":"TRAP","f":"The least-squares line always passes through (x̄, ȳ).","b":"TRUE — it is a property of the least-squares fit"},{"i":"M1.07.f01","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"The quadratic formula for ax² + bx + c = 0","b":"x=(-b±sqrt(b^2-4ac))/(2a)"},{"i":"M1.07.f02","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"Vertex of y = ax² + bx + c, in terms of b, a and D","b":"(-b/(2a),-D/(4a))"},{"i":"M1.07.f03","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"Axis of symmetry of a parabola y = ax² + bx + c","b":"x=-b/(2a)"},{"i":"M1.07.f04","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"The discriminant D of ax² + bx + c","b":"b^2-4ac"},{"i":"M1.07.f05","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"Sum and product of the roots α, β of ax² + bx + c = 0","b":"alpha+beta=-b/a, alpha*beta=c/a"},{"i":"M1.07.f06","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"|α − β| in terms of D and a","b":"sqrt(D)/|a|"},{"i":"M1.07.f07","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"Reconstruct a quadratic from its roots α and β","b":"x^2-(alpha+beta)x+alpha*beta=0"},{"i":"M1.07.f08","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"α² + β² expressed using the sum and product of the roots","b":"(alpha+beta)^2-2*alpha*beta"},{"i":"M1.07.f09","c":"M1.07","k":"M1","y":3,"t":"FORMULA","f":"Tangent slope (derivative) of f(x) = ax² + bx + c","b":"2ax+b"},{"i":"M1.07.c01","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"D = 0 means the graph does what to the x-axis?","b":"touches it (tangent)"},{"i":"M1.07.c02","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"D < 0 with real coefficients means the roots are…","b":"a complex conjugate pair"},{"i":"M1.07.c03","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"a > 0: the vertex is the … and the range is …","b":"minimum; [−D/4a, ∞)"},{"i":"M1.07.c04","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"If D > 0 with roots α < β, then f has the sign of a…","b":"outside [α, β], opposite sign strictly inside"},{"i":"M1.07.ch01","c":"M1.07","k":"M1","y":3,"t":"CHAIN","f":"Derive the quadratic formula by completing the square — order the steps","b":"1. Factor a out of the x terms: a(x² + (b/a)x) + c\n2. Complete the square: a(x + b/2a)² − b²/4a + c\n3. Set to zero and isolate: (x + b/2a)² = (b² − 4ac)/4a²\n4. Take square roots and solve: x = (−b ± √(b² − 4ac))/2a"},{"i":"M1.07.d01","c":"M1.07","k":"M1","y":3,"t":"DERIVE","f":"Why is the vertex the extremum? Give the algebraic reason.","b":"f'(x)=2ax+b is zero exactly at x=-b/2a"},{"i":"M1.08.f01","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Degree of a product: deg(pq) = ?","b":"deg p+deg q"},{"i":"M1.08.f02","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Division algorithm for polynomials: p(x) = ?","b":"q(x)s(x)+r(x) with deg r<deg q"},{"i":"M1.08.f03","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Remainder theorem: dividing p(x) by (x − a) leaves remainder…","b":"p(a)"},{"i":"M1.08.f04","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Remainder on dividing p(x) by (ax − b)","b":"p(b/a)"},{"i":"M1.08.f05","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Vieta for degree n: sum of roots and product of roots","b":"sum=-a_{n-1}/a_n, prod=(-1)^n a_0/a_n"},{"i":"M1.08.c01","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"Factor theorem: (x − a) divides p(x) exactly when…","b":"p(a) = 0"},{"i":"M1.08.c02","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"At a root of even multiplicity the graph…","b":"touches the axis"},{"i":"M1.08.c03","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"Rational root p/q (lowest terms) of an integer-coefficient polynomial satisfies…","b":"p | a₀ and q | aₙ"},{"i":"M1.08.t01","c":"M1.08","k":"M1","y":2,"t":"TRAP","f":"An odd-degree polynomial with real coefficients always has at least one real root.","b":"TRUE — non-real roots come in conjugate pairs, so an odd count leaves one real"},{"i":"M1.08.t02","c":"M1.08","k":"M1","y":2,"t":"TRAP","f":"deg(p + q) = max(deg p, deg q) always.","b":"FALSE — leading terms can cancel, so only ≤ holds"},{"i":"M1.08.c04","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"A degree-n polynomial has exactly how many roots in ℂ (with multiplicity)?","b":"n"},{"i":"S1.01.dsc01","c":"S1.01","k":"S1","y":1,"t":"DISCRIM","f":"Parameter  ⟷  Statistic","b":"Parameter\n• Describes the population\n• μ, σ, p\n• Fixed but usually unknown\n\nStatistic\n• Computed from the sample\n• x̄, s, p̂\n• Random — varies sample to sample"},{"i":"S1.01.c01","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Temperature in °C sits on which scale?","b":"Interval"},{"i":"S1.01.c02","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Jersey numbers on players are which type of variable?","b":"Nominal"},{"i":"S1.01.c03","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Satisfaction rating (poor / fair / good) is…","b":"Ordinal"},{"i":"S1.01.c04","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Which scale is the first to permit a meaningful mean and SD?","b":"Interval"},{"i":"S1.01.c05","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"The only measure of centre available for nominal data is the…","b":"mode"},{"i":"S1.01.t01","c":"S1.01","k":"S1","y":1,"t":"TRAP","f":"20 °C is twice as hot as 10 °C.","b":"FALSE — °C is interval — its zero is arbitrary, so ratios are meaningless"},{"i":"S1.01.co01","c":"S1.01","k":"S1","y":1,"t":"CONDITION","f":"Report the mean of a set of pin codes.","b":"REJECT — pin codes are nominal labels — averaging them is meaningless"},{"i":"S1.02.f01","c":"S1.02","k":"S1","y":1,"t":"FORMULA","f":"Pie chart: angle for category i with frequency fᵢ out of n","b":"360*f_i/n"},{"i":"S1.02.c01","c":"S1.02","k":"S1","y":1,"t":"CLASSIFY","f":"A Pareto chart is a bar chart that is…","b":"sorted descending with a cumulative-% line"},{"i":"S1.02.c02","c":"S1.02","k":"S1","y":1,"t":"CLASSIFY","f":"Relative frequencies across all categories always sum to…","b":"1"},{"i":"S1.02.t01","c":"S1.02","k":"S1","y":1,"t":"TRAP","f":"Starting a bar chart’s y-axis above zero is a neutral presentation choice.","b":"FALSE — a truncated axis exaggerates differences"},{"i":"S1.02.t02","c":"S1.02","k":"S1","y":1,"t":"TRAP","f":"Scaling an icon’s width and height by k makes it look k times bigger.","b":"FALSE — perceived size scales by k², not k"},{"i":"S1.02.dsc01","c":"S1.02","k":"S1","y":1,"t":"DISCRIM","f":"Bar chart  ⟷  Histogram","b":"Bar chart\n• Bars are separated\n• For categorical data\n• Height = frequency\n\nHistogram\n• Bars are adjacent\n• For numerical data in bins\n• Area ∝ frequency"},{"i":"S1.03.f01","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Sample mean x̄ for raw data","b":"(1/n)sum x_i"},{"i":"S1.03.f02","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Grouped-data mean using class marks mᵢ and frequencies fᵢ","b":"sum(f_i m_i)/sum(f_i)"},{"i":"S1.03.f03","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Population variance σ² (divisor N)","b":"(1/N)sum(x_i-mu)^2"},{"i":"S1.03.f04","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Sample variance s² (divisor n − 1)","b":"(1/(n-1))sum(x_i-xbar)^2"},{"i":"S1.03.f05","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Computational form of the sample variance","b":"(sum x_i^2-n xbar^2)/(n-1)"},{"i":"S1.03.f06","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Coefficient of variation","b":"(s/xbar)*100%"},{"i":"S1.03.f07","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"The 1.5·IQR outlier fences","b":"Q1-1.5*IQR and Q3+1.5*IQR"},{"i":"S1.03.f08","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Under y = a + bx, give ȳ, s_y and IQR_y","b":"ybar=a+b xbar, s_y=|b| s_x, IQR_y=|b| IQR_x"},{"i":"S1.03.c01","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Right-skewed data orders the centres how?","b":"mode < median < mean"},{"i":"S1.03.c02","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Which measure of centre minimises Σ(xᵢ − c)²?","b":"the mean"},{"i":"S1.03.c03","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Which measure of centre minimises Σ|xᵢ − c|?","b":"the median"},{"i":"S1.03.c04","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Boxplot whiskers extend to…","b":"the most extreme points inside the fences"},{"i":"S1.03.dsc01","c":"S1.03","k":"S1","y":3,"t":"DISCRIM","f":"Mean  ⟷  Median","b":"Mean\n• Minimises Σ(x − c)²\n• Sensitive to outliers\n• Uses every value\n• Σ(xᵢ − this) = 0\n\nMedian\n• Minimises Σ|x − c|\n• Resistant to outliers\n• Uses only the middle position\n• Available for ordinal data"},{"i":"S1.03.dsc02","c":"S1.03","k":"S1","y":3,"t":"DISCRIM","f":"Divisor n  ⟷  Divisor n − 1","b":"Divisor n\n• Population variance σ²\n• Biased downward as an estimator of σ²\n• Used when μ is known\n\nDivisor n − 1\n• Sample variance s²\n• Unbiased estimator of σ²\n• Costs one degree of freedom for x̄"},{"i":"S1.03.d01","c":"S1.03","k":"S1","y":3,"t":"DERIVE","f":"Why divide by n − 1 in the sample variance?","b":"xbar is estimated from the same data, costing one degree of freedom; it makes s^2 unbiased"},{"i":"S1.03.t01","c":"S1.03","k":"S1","y":3,"t":"TRAP","f":"Adding a constant to every value changes the standard deviation.","b":"FALSE — shifting changes location only; spread is unchanged"},{"i":"S1.04.f01","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Sample covariance of x and y","b":"(1/(n-1))sum(x_i-xbar)(y_i-ybar)"},{"i":"S1.04.f02","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Correlation r in terms of covariance and the two SDs","b":"cov(x,y)/(s_x s_y)"},{"i":"S1.04.f03","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Least-squares slope b₁ in terms of r, s_y and s_x","b":"b1=r*s_y/s_x"},{"i":"S1.04.f04","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Least-squares intercept b₀","b":"b0=ybar-b1*xbar"},{"i":"S1.04.f05","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Definition of the residual eᵢ","b":"e_i=y_i-yhat_i"},{"i":"S1.04.c01","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"The four things to read off a scatterplot are…","b":"direction, form, strength, outliers"},{"i":"S1.04.c02","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"r² is interpreted as…","b":"the proportion of variation in y explained by the linear relation with x"},{"i":"S1.04.c03","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"Under x′ = a + bx with b < 0, the correlation r…","b":"flips sign"},{"i":"S1.04.dsc01","c":"S1.04","k":"S1","y":3,"t":"DISCRIM","f":"Covariance  ⟷  Correlation r","b":"Covariance\n• Units of x × units of y\n• Range (−∞, ∞)\n• Magnitude means nothing comparable\n• Scales by b under x′ = a + bx\n\nCorrelation r\n• Unitless\n• Range [−1, 1]\n• Magnitude means strength of linear relation\n• Unchanged if b > 0"},{"i":"S1.04.t01","c":"S1.04","k":"S1","y":3,"t":"TRAP","f":"r = 0 means x and y have no relationship.","b":"FALSE — r measures linear association only — a perfect parabola gives r = 0"},{"i":"S1.04.t02","c":"S1.04","k":"S1","y":3,"t":"TRAP","f":"r is symmetric in x and y, and so is the regression slope.","b":"FALSE — r is symmetric but the regression slope is not"},{"i":"S1.04.co01","c":"S1.04","k":"S1","y":3,"t":"CONDITION","f":"Use the fitted line to predict y at an x far outside the observed range.","b":"REJECT — extrapolation outside the observed range of x is unjustified"},{"i":"S1.04.co02","c":"S1.04","k":"S1","y":3,"t":"CONDITION","f":"A strong correlation is reported, so the paper concludes x causes y.","b":"REJECT — correlation is not causation — confounding and lurking variables"},{"i":"S1.04.c04","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"Two categorical variables look independent when…","b":"every conditional distribution matches the marginal"},{"i":"S1.05.f01","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Permutations of r from n distinct objects, ⁿPᵣ","b":"n!/(n-r)!"},{"i":"S1.05.f02","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Combinations of r from n distinct objects, ⁿCᵣ","b":"n!/(r!(n-r)!)"},{"i":"S1.05.f03","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Arrangements of n objects with repeats n₁, n₂, …, n_k","b":"n!/(n1! n2! ... nk!)"},{"i":"S1.05.f04","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"r selections from n types, repetition allowed, order does NOT matter","b":"C(n+r-1,r)"},{"i":"S1.05.f05","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"r selections from n types, repetition allowed, order MATTERS","b":"n^r"},{"i":"S1.05.f06","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Circular arrangements of n distinct objects","b":"(n-1)!"},{"i":"S1.05.f07","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Pascal’s identity: C(n,r) + C(n,r−1) = ?","b":"C(n+1,r)"},{"i":"S1.05.f08","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Sum of all binomial coefficients Σ C(n,r) for r = 0…n","b":"2^n"},{"i":"S1.05.f09","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Binomial theorem: (a + b)ⁿ = ?","b":"sum_{r=0}^{n} C(n,r) a^(n-r) b^r"},{"i":"S1.05.f10","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"The (r+1)-th term of the binomial expansion of (a + b)ⁿ","b":"C(n,r) a^(n-r) b^r"},{"i":"S1.05.dsc01","c":"S1.05","k":"S1","y":3,"t":"DISCRIM","f":"Permutation  ⟷  Combination","b":"Permutation\n• Order matters\n• n!/(n−r)!\n• Swapping two chosen items gives a new outcome\n• Arranging books on a shelf\n\nCombination\n• Order does not matter\n• n!/(r!(n−r)!)\n• Swapping two chosen items gives the same outcome\n• Choosing a committee"},{"i":"S1.05.ch01","c":"S1.05","k":"S1","y":3,"t":"CHAIN","f":"Counting arrangements where certain items must stay together — order the method","b":"1. Glue the joined items into a single block\n2. Arrange the blocks together with the remaining items\n3. Arrange the items within the block\n4. Multiply the two counts"},{"i":"S1.05.t01","c":"S1.05","k":"S1","y":3,"t":"TRAP","f":"“At least one” problems are usually easiest computed directly.","b":"FALSE — use 1 − P(none) — the complement is almost always easier"},{"i":"S1.05.c01","c":"S1.05","k":"S1","y":3,"t":"CLASSIFY","f":"Items that must be SEPARATED are handled by…","b":"arranging the others first, then placing into the gaps"},{"i":"S1.06.f01","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Kolmogorov’s three axioms, stated compactly","b":"P(A)>=0; P(S)=1; countable additivity for disjoint events"},{"i":"S1.06.f02","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Complement rule: P(Aᶜ) = ?","b":"1-P(A)"},{"i":"S1.06.f03","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Addition rule for two events","b":"P(A)+P(B)-P(A∩B)"},{"i":"S1.06.f04","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"P(A \\ B) in terms of P(A) and P(A ∩ B)","b":"P(A)-P(A∩B)"},{"i":"S1.06.f05","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Boole’s inequality","b":"P(union A_i)<=sum P(A_i)"},{"i":"S1.06.f06","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Equally likely outcomes: P(A) = ?","b":"|A|/|S|"},{"i":"S1.06.t01","c":"S1.06","k":"S1","y":2,"t":"TRAP","f":"Mutually exclusive events with positive probability are independent.","b":"FALSE — they are necessarily dependent — knowing A occurred tells you B did not"},{"i":"S1.06.t02","c":"S1.06","k":"S1","y":2,"t":"TRAP","f":"For the sum of two dice, the outcomes {2,…,12} are equally likely.","b":"FALSE — the sample space is not symmetric — the 36 ordered pairs are"},{"i":"S1.06.dsc01","c":"S1.06","k":"S1","y":2,"t":"DISCRIM","f":"Mutually exclusive  ⟷  Independent","b":"Mutually exclusive\n• A ∩ B = ∅\n• Cannot both occur\n• P(A ∪ B) = P(A) + P(B)\n\nIndependent\n• P(A ∩ B) = P(A)P(B)\n• Occurrence of one says nothing about the other\n• P(A | B) = P(A)"},{"i":"S1.07.f01","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Definition of conditional probability P(A | B)","b":"P(A∩B)/P(B)"},{"i":"S1.07.f02","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Multiplication rule for P(A ∩ B), both orderings","b":"P(B)P(A|B)=P(A)P(B|A)"},{"i":"S1.07.f03","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Chain rule for P(A₁ ∩ … ∩ Aₙ)","b":"P(A1)P(A2|A1)...P(An|A1∩...∩A_{n-1})"},{"i":"S1.07.f04","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Independence of A and B, stated two ways","b":"P(A∩B)=P(A)P(B); equivalently P(A|B)=P(A)"},{"i":"S1.07.f05","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Law of total probability over a partition B₁…B_k","b":"P(A)=sum P(B_i)P(A|B_i)"},{"i":"S1.07.f06","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Bayes’ rule for P(B_j | A)","b":"P(B_j)P(A|B_j)/sum_i P(B_i)P(A|B_i)"},{"i":"S1.07.c01","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"In Bayes’ rule, P(A | B_j) is called the…","b":"likelihood"},{"i":"S1.07.c02","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"If A and B are independent, which pair is NOT guaranteed independent?","b":"none — Aᶜ&B, A&Bᶜ, Aᶜ&Bᶜ are all independent"},{"i":"S1.07.t01","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"P(A | B) = P(B | A).","b":"FALSE — reversing the conditioning is the single most common error in the paper"},{"i":"S1.07.t02","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"Pairwise independence of A₁…Aₙ implies mutual independence.","b":"FALSE — mutual independence needs the product rule for every sub-collection"},{"i":"S1.07.t03","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"A rare condition with a highly accurate test still gives a low posterior.","b":"TRUE — the base rate dominates when the prior is small"},{"i":"S1.07.ch01","c":"S1.07","k":"S1","y":3,"t":"CHAIN","f":"The handbook’s recommended method for any two-way Bayes problem","b":"1. Build a 2×2 contingency table with a convenient total (say 10,000)\n2. Fill in the cells from the prior and the likelihoods\n3. Read the relevant row or column total\n4. Divide the cell by that total — Bayes becomes division"},{"i":"S1.07.c03","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"Conditioning on B does what to the sample space?","b":"restricts it to B and rescales"},{"i":"M2.01.f01","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Dot product of u and v, in sum and matrix notation","b":"sum u_i v_i = u^T v"},{"i":"M2.01.f02","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Angle between two vectors: cos θ = ?","b":"(u·v)/(||u|| ||v||)"},{"i":"M2.01.f03","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Transpose of a product: (AB)ᵀ = ?","b":"B^T A^T"},{"i":"M2.01.f04","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Inverse of a product: (AB)⁻¹ = ?","b":"B^-1 A^-1"},{"i":"M2.01.f05","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Entry (i,j) of the matrix product AB","b":"sum_k a_ik b_kj"},{"i":"M2.01.f06","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Trace identity relating tr(AB) and tr(BA)","b":"tr(AB)=tr(BA)"},{"i":"M2.01.f07","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Split any square A uniquely into symmetric + skew parts","b":"A=(1/2)(A+A^T)+(1/2)(A-A^T)"},{"i":"M2.01.c01","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"An orthogonal matrix satisfies…","b":"AᵀA = I, so A⁻¹ = Aᵀ"},{"i":"M2.01.c02","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"A skew-symmetric matrix has which diagonal entries?","b":"all zero"},{"i":"M2.01.c03","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"Idempotent means…","b":"A² = A"},{"i":"M2.01.t01","c":"M2.01","k":"M2","y":2,"t":"TRAP","f":"AB = 0 implies A = 0 or B = 0.","b":"FALSE — matrices have zero divisors — neither factor need vanish"},{"i":"M2.01.t02","c":"M2.01","k":"M2","y":2,"t":"TRAP","f":"AB = AC implies B = C.","b":"FALSE — cancellation requires A to be invertible"},{"i":"M2.02.f01","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"The three elementary row operations","b":"swap rows; scale a row by c≠0; add a multiple of one row to another"},{"i":"M2.02.f02","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"Structure of the solution set of Ax = b","b":"x_p + N(A)"},{"i":"M2.02.c01","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"rank(A) < rank([A|b]) means the system has…","b":"no solution"},{"i":"M2.02.c02","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"rank(A) = rank([A|b]) = n (number of unknowns) means…","b":"a unique solution"},{"i":"M2.02.c03","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"rank(A) = rank([A|b]) = r < n means infinitely many solutions with how many free parameters?","b":"n − r"},{"i":"M2.02.c04","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"A homogeneous system Ax = 0 has a non-trivial solution exactly when…","b":"rank(A) < n"},{"i":"M2.02.c05","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"The RREF of a matrix is…","b":"unique"},{"i":"M2.02.ch01","c":"M2.02","k":"M2","y":3,"t":"CHAIN","f":"Gauss–Jordan: from a system to its full solution set","b":"1. Write the augmented matrix [A | b]\n2. Row-reduce to reduced row echelon form\n3. Identify pivot columns (basic variables) and non-pivot columns (free variables)\n4. Set each free variable to a parameter\n5. Express the basic variables in terms of those parameters"},{"i":"M2.02.ch02","c":"M2.02","k":"M2","y":3,"t":"CHAIN","f":"Finding an inverse by row reduction","b":"1. Form the augmented block [A | I]\n2. Row-reduce the left block toward I\n3. If a zero row appears on the left, stop — A is singular\n4. Otherwise read the inverse off the right block: [I | A⁻¹]"},{"i":"M2.02.f03","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"List four equivalent statements to “A (n×n) is invertible”","b":"det A≠0; rank A=n; RREF is I; Ax=0 has only the trivial solution"},{"i":"M2.02.co01","c":"M2.02","k":"M2","y":3,"t":"CONDITION","f":"Row operations were applied, then the column space was read off the reduced matrix’s columns.","b":"REJECT — row operations change the column space — use the ORIGINAL matrix’s pivot columns"},{"i":"M2.02.t01","c":"M2.02","k":"M2","y":3,"t":"TRAP","f":"A homogeneous system with more unknowns than equations always has a non-trivial solution.","b":"TRUE — m < n forces rank(A) < n, so free variables exist"},{"i":"M2.03.f01","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Determinant of a 2×2 matrix [[a,b],[c,d]]","b":"ad-bc"},{"i":"M2.03.f02","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Cofactor C_ij in terms of the minor M_ij","b":"(-1)^(i+j) M_ij"},{"i":"M2.03.f03","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"det(kA) for an n×n matrix","b":"k^n det A"},{"i":"M2.03.f04","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Inverse via the adjugate","b":"A^-1=(1/det A) adj(A)"},{"i":"M2.03.f05","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Cramer’s rule for xᵢ","b":"x_i=det(A_i)/det(A)"},{"i":"M2.03.f06","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Determinant of a triangular or diagonal matrix","b":"product of the diagonal entries"},{"i":"M2.03.c01","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Adding a multiple of one row to another does what to the determinant?","b":"leaves it unchanged"},{"i":"M2.03.c02","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Swapping two rows does what to the determinant?","b":"flips its sign"},{"i":"M2.03.c03","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Geometrically, |det A| is…","b":"the factor by which A scales area or volume"},{"i":"M2.03.t01","c":"M2.03","k":"M2","y":2,"t":"TRAP","f":"det(A + B) = det A + det B.","b":"FALSE — the determinant is multiplicative, not additive"},{"i":"M2.03.co01","c":"M2.03","k":"M2","y":2,"t":"CONDITION","f":"Apply Cramer’s rule to a 3×4 system.","b":"REJECT — Cramer’s rule needs a square, non-singular system — row-reduce instead"},{"i":"M2.03.c04","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"A zero determinant means the transformation…","b":"collapses space into a lower dimension"},{"i":"M2.04.f01","c":"M2.04","k":"M2","y":2,"t":"FORMULA","f":"The three-part subspace test","b":"0∈W; closed under addition; closed under scalar multiplication"},{"i":"M2.04.f02","c":"M2.04","k":"M2","y":2,"t":"FORMULA","f":"Dimension formula for the sum of two subspaces","b":"dim(U+W)=dim U+dim W-dim(U∩W)"},{"i":"M2.04.c01","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"dim of M_{m×n}, the space of m×n matrices, is…","b":"mn"},{"i":"M2.04.c02","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"dim of P_n, polynomials of degree ≤ n, is…","b":"n + 1"},{"i":"M2.04.c03","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"The span of a set of vectors is…","b":"the smallest subspace containing them"},{"i":"M2.04.t01","c":"M2.04","k":"M2","y":2,"t":"TRAP","f":"The union of two subspaces is a subspace.","b":"FALSE — the union generally fails closure under addition; the intersection is fine"},{"i":"M2.04.co01","c":"M2.04","k":"M2","y":2,"t":"CONDITION","f":"A plane in ℝ³ that does not pass through the origin is proposed as a subspace.","b":"REJECT — it fails to contain 0 — it is an affine subspace, not a subspace"},{"i":"M2.04.c04","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"The solution set of a HOMOGENEOUS system is…","b":"a subspace"},{"i":"M2.05.f01","c":"M2.05","k":"M2","y":2,"t":"FORMULA","f":"Definition of linear independence","b":"c1 v1+...+ck vk=0 implies all c_i=0"},{"i":"M2.05.c01","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"Any set containing the zero vector is…","b":"dependent"},{"i":"M2.05.c02","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"More than n vectors in ℝⁿ are…","b":"always dependent"},{"i":"M2.05.c03","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"Vectors as columns of A are independent exactly when…","b":"every column is a pivot column"},{"i":"M2.05.co01","c":"M2.05","k":"M2","y":2,"t":"CONDITION","f":"To identify an independent subset of the ORIGINAL vectors, they were placed in rows and reduced.","b":"REJECT — put them in columns — pivot columns identify original vectors; rows only give a basis for the span"},{"i":"M2.05.t01","c":"M2.05","k":"M2","y":2,"t":"TRAP","f":"Any subset of an independent set is independent.","b":"TRUE — independence is inherited by subsets; dependence is inherited by supersets"},{"i":"M2.06.f01","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Definition of a basis","b":"linearly independent and spans V"},{"i":"M2.06.f02","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"rank(A) equals which three things?","b":"dim row space = dim column space = number of pivots in RREF"},{"i":"M2.06.f03","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Reading a ROW SPACE basis off the RREF","b":"the non-zero rows of the RREF"},{"i":"M2.06.f04","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Reading a COLUMN SPACE basis off the RREF","b":"the columns of the ORIGINAL A in the pivot positions"},{"i":"M2.06.c01","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"In a space of dimension n, any n independent vectors…","b":"form a basis"},{"i":"M2.06.c02","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"rank(A) is bounded above by…","b":"min(m, n)"},{"i":"M2.06.c03","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"dim{0}, the zero subspace, is…","b":"0"},{"i":"M2.06.dsc01","c":"M2.06","k":"M2","y":3,"t":"DISCRIM","f":"Row space  ⟷  Column space","b":"Row space\n• Preserved by row operations\n• Lives in ℝⁿ\n• Basis = non-zero rows of the RREF\n• Its orthogonal complement is the null space\n\nColumn space\n• Changed by row operations\n• Lives in ℝᵐ\n• Basis = pivot columns of the ORIGINAL matrix\n• Equals the image of the map x ↦ Ax"},{"i":"M2.06.t01","c":"M2.06","k":"M2","y":3,"t":"TRAP","f":"Row rank can differ from column rank.","b":"FALSE — row rank always equals column rank"},{"i":"M2.07.f01","c":"M2.07","k":"M2","y":3,"t":"FORMULA","f":"The rank–nullity theorem","b":"rank(A)+nullity(A)=n"},{"i":"M2.07.f02","c":"M2.07","k":"M2","y":3,"t":"FORMULA","f":"Definition of the null space N(A)","b":"{x: Ax=0}"},{"i":"M2.07.c01","c":"M2.07","k":"M2","y":3,"t":"CLASSIFY","f":"The nullity equals the number of…","b":"free variables"},{"i":"M2.07.ch01","c":"M2.07","k":"M2","y":3,"t":"CHAIN","f":"Finding a basis for the null space N(A)","b":"1. Reduce A to RREF\n2. Identify pivot columns and free columns\n3. Write each basic variable in terms of the free variables\n4. Set one free variable to 1 and the rest to 0, in turn\n5. Collect one basis vector per free variable"},{"i":"M2.07.d01","c":"M2.07","k":"M2","y":3,"t":"DERIVE","f":"State the one-line proof of rank–nullity.","b":"every column is either a pivot column (rank) or a free column (nullity)"},{"i":"M2.07.t01","c":"M2.07","k":"M2","y":3,"t":"TRAP","f":"The null-space basis vectors produced by the free-variable method are automatically independent.","b":"TRUE — each has a 1 where the others have 0"},{"i":"M2.08.f01","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"The linearity condition, in one combined equation","b":"T(au+bv)=aT(u)+bT(v)"},{"i":"M2.08.f02","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"Rank–nullity for a linear map T : V → W","b":"dim(ker T)+dim(im T)=dim V"},{"i":"M2.08.f03","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"How the matrix [T] is built from a basis of V","b":"its j-th column is [T(v_j)]_C"},{"i":"M2.08.f04","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"Similar matrices — the defining relation","b":"B=P^-1 A P"},{"i":"M2.08.c01","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"T is injective exactly when…","b":"ker T = {0}"},{"i":"M2.08.c02","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"A fast disqualifying test for linearity is…","b":"check T(0) = 0"},{"i":"M2.08.c03","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"Similar matrices share all of the following EXCEPT…","b":"their entries"},{"i":"M2.08.c04","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"An affine map x ↦ Ax + b is linear exactly when…","b":"b = 0"},{"i":"M2.08.dsc01","c":"M2.08","k":"M2","y":3,"t":"DISCRIM","f":"Kernel  ⟷  Image","b":"Kernel\n• {v : T(v) = 0}\n• A subspace of V\n• Its dimension is the nullity\n• Equals N(A) for T(x) = Ax\n\nImage\n• {T(v) : v ∈ V}\n• A subspace of W\n• Its dimension is the rank\n• Equals C(A) for T(x) = Ax"},{"i":"M2.08.dsc02","c":"M2.08","k":"M2","y":3,"t":"DISCRIM","f":"Similar matrices  ⟷  Equivalent matrices","b":"Similar matrices\n• B = P⁻¹AP\n• Same transformation, different basis\n• Share trace and eigenvalues\n\nEquivalent matrices\n• B = QAP with P, Q invertible\n• Same rank — and that is all\n• Need not share eigenvalues"},{"i":"M2.08.t01","c":"M2.08","k":"M2","y":3,"t":"TRAP","f":"For dim V = dim W finite, injective and surjective are equivalent for a linear map.","b":"TRUE — rank–nullity forces one from the other when the dimensions match"},{"i":"M2.09.f01","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"The three inner-product axioms (real case)","b":"symmetry; bilinearity; positive definiteness"},{"i":"M2.09.f02","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Cauchy–Schwarz inequality","b":"|<u,v>|<=||u|| ||v||"},{"i":"M2.09.f03","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"The parallelogram law","b":"||u+v||^2+||u-v||^2=2||u||^2+2||v||^2"},{"i":"M2.09.f04","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Definition of the orthogonal complement U⊥","b":"{v: <v,u>=0 for all u in U}"},{"i":"M2.09.f05","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Dimension relation for a subspace and its complement","b":"dim U+dim U^perp=dim V"},{"i":"M2.09.f06","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"For a matrix, N(A) is the orthogonal complement of which space?","b":"the row space"},{"i":"M2.09.c01","c":"M2.09","k":"M2","y":2,"t":"CLASSIFY","f":"Cauchy–Schwarz holds with equality exactly when u and v are…","b":"parallel"},{"i":"M2.09.t01","c":"M2.09","k":"M2","y":2,"t":"TRAP","f":"A set of non-zero pairwise orthogonal vectors is linearly independent.","b":"TRUE — pairing Σcᵢvᵢ = 0 with vⱼ kills every term but cⱼ‖vⱼ‖²"},{"i":"M2.09.t02","c":"M2.09","k":"M2","y":2,"t":"TRAP","f":"Linearly independent vectors are automatically orthogonal.","b":"FALSE — the converse of “orthogonal ⇒ independent” fails"},{"i":"M2.10.f01","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection of v onto a single vector u","b":"(<v,u>/<u,u>)u"},{"i":"M2.10.f02","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection of v onto a subspace with orthonormal basis {qᵢ}","b":"sum_i <v,q_i> q_i"},{"i":"M2.10.f03","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection matrix onto C(A) when A has independent columns","b":"P=A(A^T A)^-1 A^T"},{"i":"M2.10.f04","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The two properties characterising an orthogonal projection matrix","b":"P^2=P and P^T=P"},{"i":"M2.10.f05","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The normal equations for least squares","b":"A^T A xhat=A^T b"},{"i":"M2.10.f06","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The Gram–Schmidt step for wⱼ","b":"w_j=v_j-sum_{i<j}(<v_j,w_i>/<w_i,w_i>)w_i"},{"i":"M2.10.f07","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Coordinates of v in an orthonormal basis (Parseval form)","b":"v=sum <v,q_i> q_i"},{"i":"M2.10.c01","c":"M2.10","k":"M2","y":3,"t":"CLASSIFY","f":"proj_U(v) is characterised geometrically as…","b":"the unique closest point of U to v"},{"i":"M2.10.co01","c":"M2.10","k":"M2","y":3,"t":"CONDITION","f":"In Gram–Schmidt, projections are subtracted onto the ORIGINAL vectors vᵢ.","b":"REJECT — subtract projections onto the already-orthogonalised wᵢ"},{"i":"M2.10.co02","c":"M2.10","k":"M2","y":3,"t":"CONDITION","f":"Each Gram–Schmidt vector is normalised immediately, before computing the next one.","b":"REJECT — normalise at the very end, or carry fractions through the whole computation"},{"i":"M2.10.ch01","c":"M2.10","k":"M2","y":3,"t":"CHAIN","f":"Gram–Schmidt, correctly ordered","b":"1. Set w₁ = v₁\n2. For each subsequent vⱼ, compute its projections onto every previous wᵢ\n3. Subtract those projections to get wⱼ\n4. Repeat until all vectors are processed\n5. Normalise each wⱼ to qⱼ = wⱼ/‖wⱼ‖ at the end"},{"i":"M2.10.t01","c":"M2.10","k":"M2","y":3,"t":"TRAP","f":"If a Gram–Schmidt wⱼ comes out zero, the original set was dependent.","b":"TRUE — vⱼ lay in the span of the earlier vectors"},{"i":"M2.11.f01","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"2D rotation matrix by angle θ","b":"[[cos t,-sin t],[sin t,cos t]]"},{"i":"M2.11.f02","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"Reflection in the line through the origin at angle θ","b":"[[cos 2t,sin 2t],[sin 2t,-cos 2t]]"},{"i":"M2.11.c01","c":"M2.11","k":"M2","y":1,"t":"CLASSIFY","f":"det Q = +1 for an orthogonal Q means it is a…","b":"rotation"},{"i":"M2.11.c02","c":"M2.11","k":"M2","y":1,"t":"CLASSIFY","f":"Orthogonal transformations preserve…","b":"lengths, angles and distances"},{"i":"M2.11.f03","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"Composition and inverse of rotations","b":"R_a R_b=R_(a+b), R_t^-1=R_(-t)"},{"i":"M2.12.c01","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"A level curve of f(x,y) is the set…","b":"f(x,y) = c"},{"i":"M2.12.c02","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"Closely spaced contours indicate…","b":"a steep region"},{"i":"M2.12.c03","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"z = x² − y² is which surface?","b":"a saddle, with hyperbolic contours"},{"i":"M2.12.c04","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"z = x² + y² is which surface?","b":"a paraboloid, with circular contours"},{"i":"M2.12.f01","c":"M2.12","k":"M2","y":1,"t":"FORMULA","f":"The gradient ∇f and its geometric meaning","b":"(df/dx,df/dy); perpendicular to the level curve, points of steepest increase"},{"i":"M2.12.c05","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"∂f/∂x is computed by…","b":"differentiating in x while treating y as constant"},{"i":"S2.01.f01","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Marginal PMF of X from the joint PMF","b":"p_X(x)=sum_y p(x,y)"},{"i":"S2.01.f02","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Conditional PMF p(x | y)","b":"p(x,y)/p_Y(y)"},{"i":"S2.01.f03","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Independence of X and Y for discrete variables","b":"p(x,y)=p_X(x)p_Y(y) for all (x,y)"},{"i":"S2.01.co01","c":"S2.01","k":"S2","y":2,"t":"CONDITION","f":"Independence is claimed for a joint PMF whose support is {(x,y) : x ≤ y}.","b":"REJECT — a non-rectangular support rules out independence whatever the formula looks like"},{"i":"S2.01.t01","c":"S2.01","k":"S2","y":2,"t":"TRAP","f":"The marginals determine the joint distribution.","b":"FALSE — only if independence is additionally assumed"},{"i":"S2.01.c01","c":"S2.01","k":"S2","y":2,"t":"CLASSIFY","f":"For n variables, mutual independence requires…","b":"the full factorisation p(x₁…xₙ) = Πp(xᵢ)"},{"i":"S2.02.f01","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"PMF of Y = g(X) for discrete X","b":"p_Y(y)=sum_{x:g(x)=y} p_X(x)"},{"i":"S2.02.f02","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"Discrete convolution for the sum of independent X and Y","b":"p_{X+Y}(z)=sum_x p_X(x)p_Y(z-x)"},{"i":"S2.02.f03","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"CDF of the maximum of independent X and Y","b":"F_X(z)F_Y(z)"},{"i":"S2.02.f04","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"CDF of the minimum of independent X and Y","b":"1-(1-F_X(z))(1-F_Y(z))"},{"i":"S2.02.co01","c":"S2.02","k":"S2","y":1,"t":"CONDITION","f":"For the distribution of max(X,Y), work directly with the PMF rather than the CDF.","b":"REJECT — go through the CDF — “max ≤ z” is a clean event, “max = z” is not"},{"i":"S2.02.c01","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"Binomial(m,p) + Binomial(n,p), independent, equals…","b":"Binomial(m+n, p)"},{"i":"S2.02.c02","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"Poisson(λ₁) + Poisson(λ₂), independent, equals…","b":"Poisson(λ₁+λ₂)"},{"i":"S2.02.c03","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"When g is many-to-one (e.g. X²), probabilities…","b":"merge across preimages"},{"i":"S2.03.f01","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"LOTUS — expectation of g(X) without finding its distribution","b":"E[g(X)]=sum g(x)p(x)"},{"i":"S2.03.f02","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Linearity of expectation (no independence needed)","b":"E[aX+bY+c]=aE[X]+bE[Y]+c"},{"i":"S2.03.f03","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Computational formula for the variance","b":"Var(X)=E[X^2]-(E[X])^2"},{"i":"S2.03.f04","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Var(aX + b) = ?","b":"a^2 Var(X)"},{"i":"S2.03.f05","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Covariance in computational form","b":"Cov(X,Y)=E[XY]-E[X]E[Y]"},{"i":"S2.03.f06","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Var(X ± Y) in full","b":"Var(X)+Var(Y)±2Cov(X,Y)"},{"i":"S2.03.f07","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Var(Σ aᵢXᵢ) in general","b":"sum a_i^2 Var(X_i)+2 sum_{i<j} a_i a_j Cov(X_i,X_j)"},{"i":"S2.03.f08","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Correlation ρ in terms of covariance and SDs","b":"Cov(X,Y)/(sigma_X sigma_Y)"},{"i":"S2.03.f09","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Bilinearity: Cov(aX + b, cY + d) = ?","b":"ac Cov(X,Y)"},{"i":"S2.03.c01","c":"S2.03","k":"S2","y":3,"t":"CLASSIFY","f":"E[XY] = E[X]E[Y] requires…","b":"independence"},{"i":"S2.03.c02","c":"S2.03","k":"S2","y":3,"t":"CLASSIFY","f":"|ρ| = 1 exactly when…","b":"Y is an exact linear function of X"},{"i":"S2.03.t01","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"Uncorrelated implies independent.","b":"FALSE — independent ⇒ uncorrelated, but not conversely — e.g. Y = X² with X symmetric"},{"i":"S2.03.t02","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"E[g(X)] = g(E[X]).","b":"FALSE — this holds only when g is linear"},{"i":"S2.03.t03","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"Var(X + Y) = Var(X) + Var(Y) for any X and Y.","b":"FALSE — additive only when the covariance term vanishes"},{"i":"S2.04.f01","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Markov’s inequality (X ≥ 0, a > 0)","b":"P(X>=a)<=E[X]/a"},{"i":"S2.04.f02","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Chebyshev’s inequality in k-sigma form","b":"P(|X-mu|>=k sigma)<=1/k^2"},{"i":"S2.04.f03","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Chebyshev’s inequality in epsilon form","b":"P(|X-mu|>=eps)<=sigma^2/eps^2"},{"i":"S2.04.c01","c":"S2.04","k":"S2","y":2,"t":"CLASSIFY","f":"Chebyshev guarantees at least what fraction within 2 SDs?","b":"75%"},{"i":"S2.04.c02","c":"S2.04","k":"S2","y":2,"t":"CLASSIFY","f":"Chebyshev guarantees at least what fraction within 3 SDs?","b":"89%"},{"i":"S2.04.d01","c":"S2.04","k":"S2","y":2,"t":"DERIVE","f":"How is Chebyshev derived from Markov?","b":"apply Markov to (X-mu)^2"},{"i":"S2.04.ch01","c":"S2.04","k":"S2","y":2,"t":"CHAIN","f":"From Markov to the weak law of large numbers","b":"1. Markov’s inequality for a non-negative variable\n2. Apply it to (X − μ)² to obtain Chebyshev\n3. Apply Chebyshev to X̄ₙ, whose variance is σ²/n\n4. Let n → ∞: the bound σ²/(nε²) → 0, giving the WLLN"},{"i":"S2.04.co01","c":"S2.04","k":"S2","y":2,"t":"CONDITION","f":"Use Chebyshev to answer a question that names the distribution as Normal(10, 4).","b":"REJECT — a named distribution should be computed exactly — Chebyshev is for the distribution-free case"},{"i":"S2.04.dsc01","c":"S2.04","k":"S2","y":2,"t":"DISCRIM","f":"Markov  ⟷  Chebyshev","b":"Markov\n• Requires X ≥ 0\n• Uses the mean only\n• P(X ≥ a) ≤ E[X]/a\n\nChebyshev\n• Applies to any X with finite variance\n• Uses the mean and the variance\n• P(|X − μ| ≥ kσ) ≤ 1/k²"},{"i":"S2.05.f01","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Relation between the PDF and the CDF","b":"f(x)=F'(x), F(x)=int_{-inf}^{x} f"},{"i":"S2.05.f02","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"P(a < X ≤ b) in terms of the CDF","b":"F(b)-F(a)"},{"i":"S2.05.f03","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Standardising a normal variable","b":"Z=(X-mu)/sigma"},{"i":"S2.05.f04","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Symmetry identity for the standard normal CDF","b":"Phi(-z)=1-Phi(z)"},{"i":"S2.05.f05","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Exponential(λ): give the PDF, CDF, mean and variance","b":"f=lambda e^{-lambda x}; F=1-e^{-lambda x}; mean 1/lambda; var 1/lambda^2"},{"i":"S2.05.f06","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Uniform(a,b): give the mean and variance","b":"mean (a+b)/2, var (b-a)^2/12"},{"i":"S2.05.f07","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Distribution of aX + b when X ~ N(μ, σ²)","b":"N(a mu+b, a^2 sigma^2)"},{"i":"S2.05.f08","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"The empirical rule percentages for 1, 2 and 3 sigma","b":"68%, 95%, 99.7%"},{"i":"S2.05.ch01","c":"S2.05","k":"S2","y":3,"t":"CHAIN","f":"The CDF method for Y = g(X)","b":"1. Write F_Y(y) = P(g(X) ≤ y)\n2. Solve the inequality for X to express the event via F_X\n3. Differentiate to obtain f_Y(y) = dF_Y/dy"},{"i":"S2.05.c01","c":"S2.05","k":"S2","y":3,"t":"CLASSIFY","f":"The only continuous distribution that is memoryless is the…","b":"exponential"},{"i":"S2.05.c02","c":"S2.05","k":"S2","y":3,"t":"CLASSIFY","f":"The discrete counterpart of memorylessness belongs to the…","b":"geometric"},{"i":"S2.05.t01","c":"S2.05","k":"S2","y":3,"t":"TRAP","f":"A density f(x) can never exceed 1.","b":"FALSE — the density is not a probability — only the area under it is"},{"i":"S2.05.t02","c":"S2.05","k":"S2","y":3,"t":"TRAP","f":"For continuous X, P(X = c) = 0 for every single point c.","b":"TRUE — so < and ≤ may be used interchangeably"},{"i":"S2.06.f01","c":"S2.06","k":"S2","y":1,"t":"FORMULA","f":"Marginal density of X from a joint density","b":"f_X(x)=int f(x,y) dy"},{"i":"S2.06.f02","c":"S2.06","k":"S2","y":1,"t":"FORMULA","f":"Conditional density f(x | y)","b":"f(x,y)/f_Y(y)"},{"i":"S2.06.co01","c":"S2.06","k":"S2","y":1,"t":"CONDITION","f":"A joint density factors as f(x)g(y), so independence is declared — but the support is the triangle 0 < x < y < 1.","b":"REJECT — independence needs the density to factor AND the support to be a product region"},{"i":"S2.06.c01","c":"S2.06","k":"S2","y":1,"t":"CLASSIFY","f":"In joint continuous problems, most marks are lost on…","b":"the limits of integration"},{"i":"S2.06.c02","c":"S2.06","k":"S2","y":1,"t":"CLASSIFY","f":"A histogram with area normalised to 1 estimates the…","b":"density"},{"i":"S2.07.f01","c":"S2.07","k":"S2","y":2,"t":"FORMULA","f":"Mean and variance of the sample mean X̄","b":"E[Xbar]=mu, Var(Xbar)=sigma^2/n"},{"i":"S2.07.f02","c":"S2.07","k":"S2","y":2,"t":"FORMULA","f":"The standard error of the mean","b":"sigma/sqrt(n)"},{"i":"S2.07.f03","c":"S2.07","k":"S2","y":2,"t":"FORMULA","f":"E[S²] for the sample variance with divisor n − 1","b":"sigma^2"},{"i":"S2.07.f04","c":"S2.07","k":"S2","y":2,"t":"FORMULA","f":"Statement of the weak law of large numbers","b":"P(|Xbar_n-mu|>eps)->0 as n->infinity"},{"i":"S2.07.c01","c":"S2.07","k":"S2","y":2,"t":"CLASSIFY","f":"A statistic is any function of the sample that…","b":"contains no unknown parameters"},{"i":"S2.07.c02","c":"S2.07","k":"S2","y":2,"t":"CLASSIFY","f":"The empirical distribution function F̂ₙ is…","b":"unbiased and consistent for F"},{"i":"S2.08.f01","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Definition of the moment generating function","b":"M_X(t)=E[e^{tX}]"},{"i":"S2.08.f02","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Getting the k-th moment from the MGF","b":"E[X^k]=M^{(k)}(0)"},{"i":"S2.08.f03","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Variance from the MGF","b":"M''(0)-[M'(0)]^2"},{"i":"S2.08.f04","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"MGF of aX + b","b":"e^{bt}M_X(at)"},{"i":"S2.08.f05","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"MGF of a sum of independent variables","b":"M_X(t)M_Y(t)"},{"i":"S2.08.f06","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"The CLT statement for the standardised sample mean","b":"(Xbar-mu)/(sigma/sqrt n) -> N(0,1) in distribution"},{"i":"S2.08.f07","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Continuity correction for P(X ≤ k) when approximating a discrete variable","b":"P(Y<=k+0.5)"},{"i":"S2.08.f08","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"The four normal-sampling results — name the distribution of (n−1)S²/σ²","b":"chi-squared with n-1 df"},{"i":"S2.08.f09","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Distribution of (X̄ − μ)/(S/√n) when sampling from a normal","b":"t with n-1 df"},{"i":"S2.08.f10","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Distribution of the ratio (S₁²/σ₁²)/(S₂²/σ₂²)","b":"F with n1-1 and n2-1 df"},{"i":"S2.08.c01","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"The CLT assumes what about the parent distribution?","b":"only a finite variance"},{"i":"S2.08.c02","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"X̄ and S² are independent when sampling from which distribution?","b":"the normal — and it is unique in this"},{"i":"S2.08.c03","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"χ²ₖ has mean and variance…","b":"k and 2k"},{"i":"S2.08.c04","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"The t distribution compared with N(0,1) is…","b":"symmetric but heavier-tailed, converging to it as df → ∞"},{"i":"S2.08.dsc01","c":"S2.08","k":"S2","y":3,"t":"DISCRIM","f":"Law of large numbers  ⟷  Central limit theorem","b":"Law of large numbers\n• Says X̄ converges to μ\n• Proved via Chebyshev\n• A statement about location\n\nCentral limit theorem\n• Says how the error is distributed\n• Gives an approximate normal distribution\n• A statement about shape"},{"i":"S2.09.f01","c":"S2.09","k":"S2","y":3,"t":"FORMULA","f":"Definition of bias","b":"E[thetahat]-theta"},{"i":"S2.09.f02","c":"S2.09","k":"S2","y":3,"t":"FORMULA","f":"The MSE decomposition","b":"MSE=Var(thetahat)+Bias^2"},{"i":"S2.09.f03","c":"S2.09","k":"S2","y":3,"t":"FORMULA","f":"The log-likelihood ℓ(θ) for an i.i.d. sample","b":"sum log f(x_i;theta)"},{"i":"S2.09.f04","c":"S2.09","k":"S2","y":3,"t":"FORMULA","f":"The method-of-moments principle","b":"equate population moments to sample moments and solve"},{"i":"S2.09.ch01","c":"S2.09","k":"S2","y":3,"t":"CHAIN","f":"The MLE procedure","b":"1. Write the likelihood L(θ) = Π f(xᵢ; θ)\n2. Take logs to get ℓ(θ)\n3. Set dℓ/dθ = 0\n4. Solve for θ̂\n5. Verify it is a maximum (second derivative, or check the boundary)"},{"i":"S2.09.c01","c":"S2.09","k":"S2","y":3,"t":"CLASSIFY","f":"MLE of p for Bernoulli/Binomial data is…","b":"x̄"},{"i":"S2.09.c02","c":"S2.09","k":"S2","y":3,"t":"CLASSIFY","f":"MLE of λ for Exponential data is…","b":"1/x̄"},{"i":"S2.09.c03","c":"S2.09","k":"S2","y":3,"t":"CLASSIFY","f":"MLE of θ for Uniform(0, θ) is…","b":"max xᵢ"},{"i":"S2.09.c04","c":"S2.09","k":"S2","y":3,"t":"CLASSIFY","f":"The MLE of σ² for a normal uses which divisor?","b":"n — and is therefore biased"},{"i":"S2.09.co01","c":"S2.09","k":"S2","y":3,"t":"CONDITION","f":"Find the MLE of θ for Uniform(0,θ) by setting dℓ/dθ = 0.","b":"REJECT — L is decreasing wherever positive — the maximum is at the boundary θ = max xᵢ"},{"i":"S2.09.t01","c":"S2.09","k":"S2","y":3,"t":"TRAP","f":"S is an unbiased estimator of σ because S² is unbiased for σ².","b":"FALSE — unbiasedness does not survive a non-linear transformation"},{"i":"S2.09.dsc01","c":"S2.09","k":"S2","y":3,"t":"DISCRIM","f":"Method of moments  ⟷  Maximum likelihood","b":"Method of moments\n• Equate sample and population moments\n• Can give estimates outside the parameter space\n• Simple and always available\n\nMaximum likelihood\n• Maximise the likelihood function\n• Has the invariance property\n• Consistent and asymptotically normal"},{"i":"S2.09.c05","c":"S2.09","k":"S2","y":3,"t":"CLASSIFY","f":"The invariance property of the MLE says that…","b":"g(θ̂) is the MLE of g(θ)"},{"i":"S2.10.f01","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"CI for μ with σ known","b":"xbar ± z_{alpha/2} sigma/sqrt(n)"},{"i":"S2.10.f02","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"CI for μ with σ unknown, normal population","b":"xbar ± t_{alpha/2,n-1} s/sqrt(n)"},{"i":"S2.10.f03","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"CI for a proportion p","b":"phat ± z_{alpha/2} sqrt(phat(1-phat)/n)"},{"i":"S2.10.f04","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"CI for σ² in a normal population","b":"((n-1)s^2/chi^2_{alpha/2}, (n-1)s^2/chi^2_{1-alpha/2})"},{"i":"S2.10.f05","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"Sample size for a given margin of error E","b":"n=(z_{alpha/2} sigma/E)^2"},{"i":"S2.10.f06","c":"S2.10","k":"S2","y":3,"t":"FORMULA","f":"The three common z critical values (0.10, 0.05, 0.01 two-sided)","b":"1.645, 1.96, 2.576"},{"i":"S2.10.c01","c":"S2.10","k":"S2","y":3,"t":"CLASSIFY","f":"CI width shrinks like…","b":"1/√n"},{"i":"S2.10.c02","c":"S2.10","k":"S2","y":3,"t":"CLASSIFY","f":"To quarter the width of a CI you need how much more data?","b":"16×"},{"i":"S2.10.t01","c":"S2.10","k":"S2","y":3,"t":"TRAP","f":"There is a 95% probability that μ lies in this particular interval.","b":"FALSE — the parameter is fixed and the interval is random — the 95% refers to repeated sampling"},{"i":"S2.10.co01","c":"S2.10","k":"S2","y":3,"t":"CONDITION","f":"Sample size computed as n = (zσ/E)² = 42.3, so n = 42 is reported.","b":"REJECT — always round the sample size UP"},{"i":"S2.11.f01","c":"S2.11","k":"S2","y":2,"t":"FORMULA","f":"The posterior, up to proportionality","b":"posterior ∝ likelihood × prior"},{"i":"S2.11.c01","c":"S2.11","k":"S2","y":2,"t":"CLASSIFY","f":"The posterior MEAN minimises which loss?","b":"squared-error loss"},{"i":"S2.11.c02","c":"S2.11","k":"S2","y":2,"t":"CLASSIFY","f":"The MAP estimate coincides with the MLE when the prior is…","b":"flat"},{"i":"S2.11.c03","c":"S2.11","k":"S2","y":2,"t":"CLASSIFY","f":"Beta prior with a Binomial likelihood gives which posterior?","b":"Beta(α+Σxᵢ, β+n−Σxᵢ)"},{"i":"S2.11.c04","c":"S2.11","k":"S2","y":2,"t":"CLASSIFY","f":"Gamma prior with a Poisson likelihood gives…","b":"Gamma(α+Σxᵢ, β+n)"},{"i":"S2.11.f02","c":"S2.11","k":"S2","y":2,"t":"FORMULA","f":"Means of the Beta(α,β) and Gamma(α,β) distributions","b":"alpha/(alpha+beta) and alpha/beta"},{"i":"S2.11.dsc01","c":"S2.11","k":"S2","y":2,"t":"DISCRIM","f":"Confidence interval  ⟷  Credible interval","b":"Confidence interval\n• The parameter is fixed; the interval is random\n• Coverage is over repeated sampling\n• Frequentist\n\nCredible interval\n• The parameter is treated as random\n• Genuinely contains θ with the stated probability\n• Bayesian, read off the posterior"},{"i":"S2.11.c05","c":"S2.11","k":"S2","y":2,"t":"CLASSIFY","f":"As n grows, the prior…","b":"washes out as the likelihood dominates"},{"i":"S2.12.f01","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"Definition of the p-value","b":"P(statistic at least as extreme as observed | H0 true)"},{"i":"S2.12.f02","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"The p-value decision rule","b":"reject H0 iff p<=alpha"},{"i":"S2.12.f03","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"Two-tailed p-value from an observed z","b":"2P(Z>=|z_obs|)"},{"i":"S2.12.f04","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"Define the size α and the power of a test","b":"alpha=P(reject H0|H0 true); power=1-beta"},{"i":"S2.12.f05","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"The Neyman–Pearson rejection rule for two simple hypotheses","b":"reject when L(theta1)/L(theta0)>k"},{"i":"S2.12.f06","c":"S2.12","k":"S2","y":3,"t":"FORMULA","f":"Asymptotic distribution of −2 ln Λ for the generalised LRT","b":"chi^2_r with r constrained parameters"},{"i":"S2.12.c01","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"Rejecting H₀ when it is true is…","b":"a Type I error, probability α"},{"i":"S2.12.c02","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"Failing to reject H₀ when it is false is…","b":"a Type II error, probability β"},{"i":"S2.12.c03","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"Power increases with all of these EXCEPT…","b":"smaller α"},{"i":"S2.12.c04","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"H₀ always contains…","b":"equality"},{"i":"S2.12.dsc01","c":"S2.12","k":"S2","y":3,"t":"DISCRIM","f":"Type I error  ⟷  Type II error","b":"Type I error\n• Rejecting a true H₀\n• Probability α\n• Controlled by the significance level\n• A false positive\n\nType II error\n• Failing to reject a false H₀\n• Probability β\n• Its complement is the power\n• A false negative"},{"i":"S2.12.t01","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"The p-value is the probability that H₀ is true.","b":"FALSE — it is computed ASSUMING H₀, and is not P(H₀ | data)"},{"i":"S2.12.t02","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"“Fail to reject H₀” means H₀ is accepted as true.","b":"FALSE — absence of evidence is not evidence of absence"},{"i":"S2.12.t03","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"A statistically significant result is practically important.","b":"FALSE — a huge n makes trivial effects significant"},{"i":"S2.12.c05","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"A two-tailed test of μ = μ₀ at level α rejects exactly when…","b":"μ₀ falls outside the 100(1−α)% CI"},{"i":"S2.13.f01","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"One-sample z statistic","b":"z=(xbar-mu0)/(sigma/sqrt n)"},{"i":"S2.13.f02","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"One-sample t statistic and its df","b":"t=(xbar-mu0)/(s/sqrt n), df=n-1"},{"i":"S2.13.f03","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Pooled variance s_p² for the two-sample t","b":"((n1-1)s1^2+(n2-1)s2^2)/(n1+n2-2)"},{"i":"S2.13.f04","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Pooled t statistic and its df","b":"t=((xbar1-xbar2)-delta0)/(s_p sqrt(1/n1+1/n2)), df=n1+n2-2"},{"i":"S2.13.f05","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Welch t — how does its denominator differ from the pooled one?","b":"sqrt(s1^2/n1+s2^2/n2)"},{"i":"S2.13.f06","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Paired t statistic and its df","b":"t=(dbar-delta0)/(s_d/sqrt n), df=n-1"},{"i":"S2.13.f07","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"z statistic for a proportion — and which p goes in the SE?","b":"z=(phat-p0)/sqrt(p0(1-p0)/n); use p0 not phat"},{"i":"S2.13.f08","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Chi-square statistic for one variance, and its df","b":"chi^2=(n-1)s^2/sigma0^2, df=n-1"},{"i":"S2.13.f09","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"F statistic for comparing two variances, and its df","b":"F=s1^2/s2^2, df=(n1-1,n2-1)"},{"i":"S2.13.f10","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"The chi-square count statistic","b":"sum (O_i-E_i)^2/E_i"},{"i":"S2.13.f11","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"df for a chi-square goodness-of-fit test","b":"k-1-m"},{"i":"S2.13.f12","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"df and expected counts for an r×c independence test","b":"df=(r-1)(c-1), E_ij=row_i*col_j/n"},{"i":"S2.13.f13","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"The Kolmogorov–Smirnov statistic","b":"D=sup|Fhat_n(x)-F0(x)|"},{"i":"S2.13.c01","c":"S2.13","k":"S2","y":3,"t":"CLASSIFY","f":"The chi-square test on counts is always…","b":"right-tailed"},{"i":"S2.13.c02","c":"S2.13","k":"S2","y":3,"t":"CLASSIFY","f":"Validity condition for the chi-square count tests is…","b":"all Eᵢ ≥ 5"},{"i":"S2.13.dsc01","c":"S2.13","k":"S2","y":3,"t":"DISCRIM","f":"Pooled t  ⟷  Welch t","b":"Pooled t\n• Assumes equal unknown variances\n• Uses s_p²\n• df = n₁ + n₂ − 2\n\nWelch t\n• Allows unequal variances\n• Uses s₁²/n₁ + s₂²/n₂\n• df is approximate"},{"i":"S2.13.dsc02","c":"S2.13","k":"S2","y":3,"t":"DISCRIM","f":"Paired t  ⟷  Two-sample t","b":"Paired t\n• Same units measured twice\n• Work with the differences dᵢ\n• df = n − 1\n\nTwo-sample t\n• Two independent groups\n• Work with the two group means\n• df = n₁ + n₂ − 2 (pooled)"},{"i":"S2.13.co01","c":"S2.13","k":"S2","y":3,"t":"CONDITION","f":"Two independent groups, variances unknown and clearly unequal — use the pooled t.","b":"REJECT — unequal variances call for Welch’s t"},{"i":"S2.13.co02","c":"S2.13","k":"S2","y":3,"t":"CONDITION","f":"Reaction time measured before and after treatment on the same 22 subjects — use a two-sample t.","b":"REJECT — before/after on the same units is paired — ignoring the pairing loses power"},{"i":"S2.13.co03","c":"S2.13","k":"S2","y":3,"t":"CONDITION","f":"Chi-square goodness of fit where one cell has an expected count of 3.","b":"REJECT — pool sparse categories until every expected count is at least 5"},{"i":"S2.13.co04","c":"S2.13","k":"S2","y":3,"t":"CONDITION","f":"Testing a proportion, the standard error is computed using p̂ rather than p₀.","b":"REJECT — under H₀ the SE uses p₀, not p̂"},{"i":"S2.13.t01","c":"S2.13","k":"S2","y":3,"t":"TRAP","f":"Degrees of freedom should be written down before computing anything.","b":"TRUE — df is where marks disappear — fix it first"},{"i":"A.01.vBernoullip.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Bernoulli(p)","b":"p"},{"i":"A.01.vBernoullip.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Bernoulli(p)","b":"p(1-p)"},{"i":"A.01.vBinomialnp.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Binomial(n,p)","b":"np"},{"i":"A.01.vBinomialnp.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Binomial(n,p)","b":"np(1-p)"},{"i":"A.01.vGeometricp.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Geometric(p)","b":"1/p"},{"i":"A.01.vGeometricp.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Geometric(p)","b":"(1-p)/p^2"},{"i":"A.01.vPoisson.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Poisson(λ)","b":"λ"},{"i":"A.01.vPoisson.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Poisson(λ)","b":"λ"},{"i":"A.01.vDiscreteunif.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Discrete uniform","b":"(n+1)/2"},{"i":"A.01.vDiscreteunif.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Discrete uniform","b":"(n^2-1)/12"},{"i":"A.01.vHypergeometr.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Hypergeometric","b":"nK/N"},{"i":"A.01.vHypergeometr.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Hypergeometric","b":"nK/N·(N-K)/N·(N-n)/(N-1)"},{"i":"A.01.vUniformab.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Uniform(a,b)","b":"(a+b)/2"},{"i":"A.01.vUniformab.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Uniform(a,b)","b":"(b-a)^2/12"},{"i":"A.01.vExponential.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Exponential(λ)","b":"1/λ"},{"i":"A.01.vExponential.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Exponential(λ)","b":"1/λ^2"},{"i":"A.01.vNormal.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Normal(μ,σ²)","b":"μ"},{"i":"A.01.vNormal.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Normal(μ,σ²)","b":"σ^2"},{"i":"A.01.vGamma.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Gamma(α,β)","b":"α/β"},{"i":"A.01.vGamma.var","c":"A.01","k"
