<style>
/* Palette and type are taken straight from the Theory Handbook so the two
   pages read as one document. */
:root{
  --paper:#ECEFF2; --card:#FFFFFF; --ink:#0F1B29; --ink2:#33465C;
  --muted:#7C8DA0; --rule:#C9D2DB;
  --blue:#1B5A8A; --blue-t:#E8EFF5; --blue-b:#D2E0EB;
  --ox:#7C2D2D;   --ox-t:#F6EBEB;   --ox-b:#E2C9C9;
  --on-blue:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D141C; --card:#141F2B; --ink:#E4EBF2; --ink2:#A9BACB;
    --muted:#7C8DA0; --rule:#26364A;
    --blue:#5EA3D6; --blue-t:#16283A; --blue-b:#2C4E6E;
    --ox:#D98A8A;   --ox-t:#2C1A1A;   --ox-b:#4A2A2A;
    --on-blue:#0D141C;
  }
}
:root[data-theme="dark"]{
  --paper:#0D141C; --card:#141F2B; --ink:#E4EBF2; --ink2:#A9BACB;
  --muted:#7C8DA0; --rule:#26364A;
  --blue:#5EA3D6; --blue-t:#16283A; --blue-b:#2C4E6E;
  --ox:#D98A8A;   --ox-t:#2C1A1A;   --ox-b:#4A2A2A;
  --on-blue:#0D141C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.62;
}
h1,h2,h3,button,select{font-family:Archivo,system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:2px solid var(--blue)}
.bar-in{
  max-width:820px;margin:0 auto;padding:9px 24px;display:flex;align-items:center;gap:14px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
}
.bar-in .brand{font-weight:600;color:#fff;margin-right:auto;letter-spacing:.14em;text-decoration:none}
.bar-in a.ref{color:#9FB4C8;text-decoration:none;padding:3px 7px;border:1px solid transparent;border-radius:2px}
.bar-in a.ref:hover,.bar-in a.ref:focus-visible{color:#fff;border-color:#3D5670;outline:none}
.tbtn{
  background:none;border:1px solid #3D5670;border-radius:2px;color:#9FB4C8;
  cursor:pointer;font-size:11px;padding:3px 8px;font-family:inherit;letter-spacing:.09em;
}
.tbtn:hover{color:#fff;border-color:#5E7A96}

.shell{max-width:820px;margin:0 auto;padding:26px 24px 90px}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
select,.act{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 10px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
  border-radius:2px;cursor:pointer;
}
select:focus-visible,.act:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.act:hover{border-color:var(--blue);color:var(--blue)}
.spacer{margin-left:auto}

/* ---------- progress ---------- */
.prog-wrap{margin-bottom:26px}
.prog-top{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
}
.prog-top b{color:var(--blue);font-weight:600;letter-spacing:.08em}
.prog{height:3px;background:var(--rule);overflow:hidden}
.prog-fill{height:100%;background:var(--blue);width:0;transition:width .3s ease}

/* ---------- the card ---------- */
.card{
  background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--blue);
  padding:22px 24px 24px;min-height:280px;display:flex;flex-direction:column;
  cursor:pointer;position:relative;
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;color:var(--blue);background:var(--blue-t);border:1px solid var(--blue-b);padding:3px 8px;
}
.clause{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.known-dot{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--blue);letter-spacing:.12em}
.front{
  font-family:Archivo,sans-serif;font-weight:700;font-size:21px;line-height:1.34;
  letter-spacing:-.018em;margin:0;
}
.divider{height:1px;background:var(--rule);margin:20px 0 18px}

/* The answer sits in the handbook's formula block. */
.back{
  background:var(--blue-t);border:1px solid var(--blue-b);padding:14px 16px;margin:0;
  overflow-x:auto;font-size:16.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
}
.back-display{padding:6px 16px;white-space:normal}
.back-display mjx-container[display="true"]{margin:.45em 0}
.hint{
  position:absolute;bottom:18px;left:0;right:0;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;
}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[display="true"]{margin:.6em 0}
.back mjx-container{font-size:112%}
.back-display mjx-container[display="true"]{font-size:132%}

/* ---------- actions ---------- */
.actions{display:flex;gap:8px;margin-top:14px}
.btn{
  flex:1;font-size:13.5px;font-weight:600;padding:12px;border-radius:2px;cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--ink2);
}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn-flip{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn-flip:hover{opacity:.88;color:var(--on-blue)}
.btn-again{border-color:var(--ox-b);color:var(--ox);background:var(--ox-t)}
.btn-again:hover{border-color:var(--ox);color:var(--ox)}
.btn-got{border-color:var(--blue-b);color:var(--blue);background:var(--blue-t)}
.btn-got:hover{border-color:var(--blue);color:var(--blue)}

.nav{display:flex;gap:8px;margin-top:8px;align-items:center}
.nav .btn{flex:none;padding:8px 14px;font-size:13px}
.counter{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;
}

/* ---------- keys, empty state ---------- */
.keys{
  margin-top:24px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--muted);letter-spacing:.06em;line-height:2;
}
kbd{
  font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--blue-t);
  border:1px solid var(--blue-b);padding:1px 5px;border-radius:2px;color:var(--blue);font-weight:600;
}
.done{
  background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--blue);
  padding:44px 26px;text-align:center;
}
.done h2{margin:0 0 8px;font-size:21px;letter-spacing:-.018em}
.done p{margin:0;color:var(--ink2);font-size:15.5px;max-width:46ch;margin-inline:auto}

@media (max-width:560px){
  .front{font-size:18.5px}.back{font-size:15px}
  .card{padding:18px 16px 22px;min-height:250px}
  .shell{padding:20px 16px 80px}
  .bar-in{padding:9px 16px}
  select,.act{flex:1 1 auto}
}
</style>
</head>

  </div>
</main>

power set of A, where \\(\\lvert A\\rvert = n\\)","b":"\\(2^{n}\\)"},{"i":"M1.02.f02","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Inclusion–exclusion for two sets: \\(\\lvert A \\cup B\\rvert\\) = ?","b":"\\(\\lvert A\\rvert +\\lvert B\\rvert -\\lvert A\\cap B\\rvert\\)"},{"i":"M1.02.f03","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Inclusion–exclusion for three sets: \\(\\lvert A \\cup B \\cup C\\rvert\\) = ?","b":"\\(\\lvert A\\rvert +\\lvert B\\rvert +\\lvert C\\rvert -\\lvert A\\cap B\\rvert -\\lvert A\\cap C\\rvert -\\lvert B\\cap C\\rvert +\\lvert A\\cap B\\cap C\\rvert\\)"},{"i":"M1.02.f04","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"De Morgan: \\((A \\cup B)^{c}\\) = ?","b":"\\(A^{c}\\cap B^{c}\\)"},{"i":"M1.02.f05","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Set difference A \\ B written using complement and intersection","b":"\\(A\\cap B^{c}\\)"},{"i":"M1.02.f06","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"Symmetric difference \\(A \\triangle B\\) in terms of unions and intersections","b":"\\((A\\cup B) \\setminus (A\\cap B)\\)"},{"i":"M1.02.t01","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"\\(\\{1\\} \\in \\{1, 2\\}\\)","b":"FALSE — {1} is a subset, not an element, of {1,2}"},{"i":"M1.02.t02","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"\\(\\varnothing\\) and \\(\\{\\varnothing \\}\\) are the same set.","b":"FALSE — \\(\\{\\varnothing \\}\\) has one element; \\(\\varnothing\\) has none"},{"i":"M1.02.t03","c":"M1.02","k":"M1","y":2,"t":"TRAP","f":"An infinite set can be in bijection with a proper subset of itself.","b":"TRUE — that is precisely the definition of infinite"},{"i":"M1.02.c01","c":"M1.02","k":"M1","y":2,"t":"CLASSIFY","f":"Which set is uncountable?","b":"\\(\\mathbb{R}\\)"},{"i":"M1.02.c02","c":"M1.02","k":"M1","y":2,"t":"CLASSIFY","f":"Cantor’s diagonal argument establishes that…","b":"\\(\\mathbb{R}\\) is uncountable"},{"i":"M1.02.f07","c":"M1.02","k":"M1","y":2,"t":"FORMULA","f":"\\(\\lvert A \\times B\\rvert\\) in terms of \\(\\lvert A\\rvert\\) and \\(\\lvert B\\rvert\\)","b":"|A||B|"},{"i":"M1.02.d01","c":"M1.02","k":"M1","y":2,"t":"DERIVE","f":"Russell’s collection \\(R = \\{X : X \\notin X\\}\\) — state the contradiction it produces.","b":"\\(R\\in R\\) iff \\(R\\notin R\\)"},{"i":"M1.03.f01","c":"M1.03","k":"M1","y":1,"t":"FORMULA","f":"Number of relations on a set A with \\(\\lvert A\\rvert = n\\)","b":"\\(2^{n^{2}}\\)"},{"i":"M1.03.c01","c":"M1.03","k":"M1","y":1,"t":"CLASSIFY","f":"Reflexive + symmetric + transitive defines a…","b":"equivalence relation"},{"i":"M1.03.c02","c":"M1.03","k":"M1","y":1,"t":"CLASSIFY","f":"Reflexive + antisymmetric + transitive defines a…","b":"partial order"},{"i":"M1.03.dsc01","c":"M1.03","k":"M1","y":1,"t":"DISCRIM","f":"Symmetric  \\(\\leftrightarrow\\)  Antisymmetric","b":"Symmetric\n• aRb \\(\\Rightarrow\\) bRa\n• “is a sibling of”\n• Equivalence relations require it\n\nAntisymmetric\n• aRb \\(\\land\\) bRa \\(\\Rightarrow\\) a = b\n• “is less than or equal to”\n• Partial orders require it"},{"i":"M1.03.t01","c":"M1.03","k":"M1","y":1,"t":"TRAP","f":"The equivalence classes of an equivalence relation on A partition A.","b":"TRUE — they are non-empty, pairwise disjoint, and cover A"},{"i":"M1.04.f01","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of functions \\(A \\to B\\) where \\(\\lvert A\\rvert = m, \\lvert B\\rvert = n\\)","b":"\\(n^{m}\\)"},{"i":"M1.04.f02","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of injective functions \\(A \\to B, \\lvert A\\rvert = m, \\lvert B\\rvert = n\\)","b":"\\(n(n-1)\\dots (n-m+1)\\)"},{"i":"M1.04.f03","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Number of surjective functions \\(A \\to B, \\lvert A\\rvert = m, \\lvert B\\rvert = n\\)","b":"\\(\\sum_{k=0}^{n}(-1)^{k} \\binom{n}{k}(n-k)^{m}\\)"},{"i":"M1.04.f04","c":"M1.04","k":"M1","y":2,"t":"FORMULA","f":"Inverse of a composition: \\((g \\circ f)^{-1}\\) = ?","b":"\\(f^{-1}\\circ g^{-1}\\)"},{"i":"M1.04.c01","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"\\(f^{-1}\\) exists exactly when f is…","b":"a bijection"},{"i":"M1.04.c02","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"The graph of \\(f^{-1}\\) is the graph of f reflected in which line?","b":"y = x"},{"i":"M1.04.c03","c":"M1.04","k":"M1","y":2,"t":"CLASSIFY","f":"\\(f(-x) = -f(x)\\) describes a function that is…","b":"odd, symmetric about the origin"},{"i":"M1.04.dsc01","c":"M1.04","k":"M1","y":2,"t":"DISCRIM","f":"Injective (one-one)  \\(\\leftrightarrow\\)  Surjective (onto)","b":"Injective (one-one)\n• \\(f(x_{1})=f(x_{2}) \\Rightarrow x_{1}=x_{2}\\)\n• Horizontal line meets graph at most once\n• A strictly monotone function is automatically this\n\nSurjective (onto)\n• \\(f(A) = B\\)\n• Every element of the codomain is hit\n• Requires the image to fill the codomain"},{"i":"M1.04.ch01","c":"M1.04","k":"M1","y":2,"t":"CHAIN","f":"Transformations of \\(y = f(x)\\): order these from the graph of f to the graph of \\(a\\cdot f(x + k) + c\\)","b":"1. Shift left by k: f(x + k)\n2. Stretch vertically by \\(a: a\\cdot f(x + k)\\)\n3. Shift up by \\(c: a\\cdot f(x + k) + c\\)"},{"i":"M1.04.t01","c":"M1.04","k":"M1","y":2,"t":"TRAP","f":"Composition of functions is commutative.","b":"FALSE — \\(g\\circ f \\ne f\\circ g\\) in general; composition is associative but not commutative"},{"i":"M1.05.f01","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Distance between \\((x_{1},y_{1})\\) and \\((x_{2},y_{2})\\)","b":"\\(\\sqrt{(x_{2}-x_{1})^{2}+(y_{2}-y_{1})^{2}}\\)"},{"i":"M1.05.f02","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Internal section formula, ratio m:n — the point is…","b":"\\((\\frac{m x_{2}+n x_{1}}{m+n},\\frac{m y_{2}+n y_{1}}{m+n})\\)"},{"i":"M1.05.f03","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"External section formula, ratio m:n","b":"\\((\\frac{m x_{2}-n x_{1}}{m-n},\\frac{m y_{2}-n y_{1}}{m-n})\\)"},{"i":"M1.05.f04","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Centroid of a triangle with vertices \\((x_{i},y_{i})\\)","b":"\\((\\frac{x_{1}+x_{2}+x_{3}}{3},\\frac{y_{1}+y_{2}+y_{3}}{3})\\)"},{"i":"M1.05.f05","c":"M1.05","k":"M1","y":2,"t":"FORMULA","f":"Area of a triangle from three vertices","b":"\\(\\frac{1}{2}\\lvert x_{1}(y_{2}-y_{3})+x_{2}(y_{3}-y_{1})+x_{3}(y_{1}-y_{2})\\rvert\\)"},{"i":"M1.05.co01","c":"M1.05","k":"M1","y":2,"t":"CONDITION","f":"Area of a triangle computed as \\(\\tfrac{1}{2}[x_{1}(y_{2}-y_{3})+x_{2}(y_{3}-y_{1})+x_{3}(y_{1}-y_{2})]\\), answer left negative.","b":"REJECT — the modulus must be taken — area is non-negative"},{"i":"M1.05.co02","c":"M1.05","k":"M1","y":2,"t":"CONDITION","f":"Section formula, ratio m:n — m is attached to the point \\((x_{1},y_{1})\\).","b":"REJECT — m attaches to the far point \\((x_{2},y_{2})\\)"},{"i":"M1.05.c01","c":"M1.05","k":"M1","y":2,"t":"CLASSIFY","f":"Three points are collinear exactly when the triangle area \\(\\Delta\\) equals…","b":"0"},{"i":"M1.06.f01","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Slope from two points, and its trigonometric meaning","b":"\\(m=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}=\\tan (\\theta )\\)"},{"i":"M1.06.f02","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Point–slope form of a line","b":"\\(y-y_{1}=m(x-x_{1})\\)"},{"i":"M1.06.f03","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Two-point form of a line","b":"\\(y-y_{1}=\\frac{y_{2}-y_{1}}{x_{2}-x_{1}}(x-x_{1})\\)"},{"i":"M1.06.f04","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Slope–intercept form of a line","b":"\\(y=mx+c\\)"},{"i":"M1.06.f05","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Intercept form of a line","b":"\\(\\frac{x}{a}+\\frac{y}{b}=1\\)"},{"i":"M1.06.f06","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Normal form of a line (perpendicular distance p from the origin)","b":"x cos(alpha)+y \\(\\sin (\\alpha )=p\\)"},{"i":"M1.06.f07","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"General form of a line","b":"\\(Ax+By+C=0\\)"},{"i":"M1.06.f08","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"From Ax + By + C = 0, read off the slope m","b":"\\(-\\frac{A}{B}\\)"},{"i":"M1.06.f09","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"From Ax + By + C = 0, give the x-intercept and the y-intercept","b":"\\(x-\\int=-\\frac{C}{A}, y-\\int=-\\frac{C}{B}\\)"},{"i":"M1.06.f10","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Perpendicular distance from \\((x_{0},y_{0})\\) to Ax + By + C = 0","b":"\\(\\frac{\\lvert A x_{0}+B y_{0}+C\\rvert }{\\sqrt{A^{2}+B^{2}}}\\)"},{"i":"M1.06.f11","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Distance between the parallels \\(Ax + By + C_{1} = 0\\) and \\(Ax + By + C_{2} = 0\\)","b":"\\(\\frac{\\lvert C_{1}-C_{2}\\rvert }{\\sqrt{A^{2}+B^{2}}}\\)"},{"i":"M1.06.f12","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Angle between two lines with slopes \\(m_{1}\\) and \\(m_{2}\\)","b":"\\(\\tan (\\theta )=\\frac{\\lvert (m_{1}-m_{2})}{1+m_{1} m_{2}}\\rvert\\)"},{"i":"M1.06.f13","c":"M1.06","k":"M1","y":3,"t":"FORMULA","f":"Line through \\((x_{1},y_{1})\\) perpendicular to Ax + By + C = 0","b":"\\(B(x-x_{1})-A(y-y_{1})=0\\)"},{"i":"M1.06.c01","c":"M1.06","k":"M1","y":3,"t":"CLASSIFY","f":"Two non-vertical lines are perpendicular exactly when…","b":"\\(m_{1}m_{2} = -1\\)"},{"i":"M1.06.c02","c":"M1.06","k":"M1","y":3,"t":"CLASSIFY","f":"\\(A_{1}x+B_{1}y+C_{1}=0\\) and \\(A_{2}x+B_{2}y+C_{2}=0\\) are parallel (not identical) when…","b":"\\(\\frac{A_{1}}{A_{2} }= \\frac{B_{1}}{B_{2} }\\ne \\frac{C_{1}}{C_{2}}\\)"},{"i":"M1.06.co01","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Apply the point-to-line distance formula directly to the line written as y = 3x + 2.","b":"REJECT — rewrite in general form with everything on one side first"},{"i":"M1.06.co02","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Use \\(d = \\frac{\\lvert C_{1}-C_{2}\\rvert }{\\sqrt{A^{2}+B^{2}}}\\) for 2x + 3y + 1 = 0 and 4x + 6y + 7 = 0.","b":"REJECT — A and B must be identical — rescale one equation first"},{"i":"M1.06.co03","c":"M1.06","k":"M1","y":3,"t":"CONDITION","f":"Use \\(m_{1}m_{2} = -1\\) to test perpendicularity when one of the lines is vertical ,"k":"M1","y":3,"t":"CLASSIFY","f":"D < 0 with real coefficients means the roots are…","b":"a complex conjugate pair"},{"i":"M1.07.c03","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"a > 0: the vertex is the … and the range is …","b":"minimum; [−D/4a, ∞)"},{"i":"M1.07.c04","c":"M1.07","k":"M1","y":3,"t":"CLASSIFY","f":"If D > 0 with roots \\(\\alpha < \\beta\\), then f has the sign of a…","b":"outside \\([\\alpha , \\beta ]\\), opposite sign strictly inside"},{"i":"M1.07.ch01","c":"M1.07","k":"M1","y":3,"t":"CHAIN","f":"Derive the quadratic formula by completing the square — order the steps","b":"1. Factor a out of the x terms: \\(a(x^{2} + \\frac{b}{a}x) + c\\)\n2. Complete the square: \\(a(x + b/2a)^{2} - \\frac{b^{2}}{4a }+ c\\)\n3. Set to zero and isolate: \\((x + b/2a)^{2} = \\frac{b^{2} - 4ac}{4a^{2}}\\)\n4. Take square roots and solve: \\(x = \\frac{-b \\pm \\sqrt{b^{2} - 4ac}}{2a}\\)"},{"i":"M1.07.d01","c":"M1.07","k":"M1","y":3,"t":"DERIVE","f":"Why is the vertex the extremum? Give the algebraic reason.","b":"\\(f'(x)=2ax+b\\) is zero exactly at \\(x=-\\frac{b}{2a}\\)"},{"i":"M1.08.f01","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Degree of a product: \\(\\deg (pq)\\) = ?","b":"\\(\\deg p+\\deg q\\)"},{"i":"M1.08.f02","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Division algorithm for polynomials: p(x) = ?","b":"q(x)s(x)+r(x) with deg r<deg q"},{"i":"M1.08.f03","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Remainder theorem: dividing p(x) by (x − a) leaves remainder…","b":"\\(p(a)\\)"},{"i":"M1.08.f04","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Remainder on dividing p(x) by (ax − b)","b":"\\(p\\frac{b}{a}\\)"},{"i":"M1.08.f05","c":"M1.08","k":"M1","y":2,"t":"FORMULA","f":"Vieta for degree n: sum of roots and product of roots","b":"\\(\\sum=-\\frac{a_{n-1}}{a_{n}}, \\prod=(-1)^{n} \\frac{a_{0}}{a_{n}}\\)"},{"i":"M1.08.c01","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"Factor theorem: (x − a) divides p(x) exactly when…","b":"\\(p(a) = 0\\)"},{"i":"M1.08.c02","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"At a root of even multiplicity the graph…","b":"touches the axis"},{"i":"M1.08.c03","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"Rational root \\(\\frac{p}{q}\\) (lowest terms) of an integer-coefficient polynomial satisfies…","b":"p | a₀ and q | aₙ"},{"i":"M1.08.t01","c":"M1.08","k":"M1","y":2,"t":"TRAP","f":"An odd-degree polynomial with real coefficients always has at least one real root.","b":"TRUE — non-real roots come in conjugate pairs, so an odd count leaves one real"},{"i":"M1.08.t02","c":"M1.08","k":"M1","y":2,"t":"TRAP","f":"\\(\\deg (p + q) = \\max (\\deg p, \\deg q)\\) always.","b":"FALSE — leading terms can cancel, so only \\(\\le\\) holds"},{"i":"M1.08.c04","c":"M1.08","k":"M1","y":2,"t":"CLASSIFY","f":"A degree-n polynomial has exactly how many roots in \\(\\mathbb{C}\\) (with multiplicity)?","b":"n"},{"i":"S1.01.dsc01","c":"S1.01","k":"S1","y":1,"t":"DISCRIM","f":"Parameter  \\(\\leftrightarrow\\)  Statistic","b":"Parameter\n• Describes the population\n• \\(\\mu , \\sigma , p\\)\n• Fixed but usually unknown\n\nStatistic\n• Computed from the sample\n• \\(\\bar{x}, s, \\hat{p}\\)\n• Random — varies sample to sample"},{"i":"S1.01.c01","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Temperature in °C sits on which scale?","b":"Interval"},{"i":"S1.01.c02","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Jersey numbers on players are which type of variable?","b":"Nominal"},{"i":"S1.01.c03","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Satisfaction rating (poor / fair / good) is…","b":"Ordinal"},{"i":"S1.01.c04","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"Which scale is the first to permit a meaningful mean and SD?","b":"Interval"},{"i":"S1.01.c05","c":"S1.01","k":"S1","y":1,"t":"CLASSIFY","f":"The only measure of centre available for nominal data is the…","b":"mode"},{"i":"S1.01.t01","c":"S1.01","k":"S1","y":1,"t":"TRAP","f":"20 °C is twice as hot as 10 °C.","b":"FALSE — °C is interval — its zero is arbitrary, so ratios are meaningless"},{"i":"S1.01.co01","c":"S1.01","k":"S1","y":1,"t":"CONDITION","f":"Report the mean of a set of pin codes.","b":"REJECT — pin codes are nominal labels — averaging them is meaningless"},{"i":"S1.02.f01","c":"S1.02","k":"S1","y":1,"t":"FORMULA","f":"Pie chart: angle for category i with frequency \\(f_{i}\\) out of n","b":"\\(360\\cdot \\frac{f_{i}}{n}\\)"},{"i":"S1.02.c01","c":"S1.02","k":"S1","y":1,"t":"CLASSIFY","f":"A Pareto chart is a bar chart that is…","b":"sorted descending with a cumulative-% line"},{"i":"S1.02.c02","c":"S1.02","k":"S1","y":1,"t":"CLASSIFY","f":"Relative frequencies across all categories always sum to…","b":"1"},{"i":"S1.02.t01","c":"S1.02","k":"S1","y":1,"t":"TRAP","f":"Starting a bar chart’s y-axis above zero is a neutral presentation choice.","b":"FALSE — a truncated axis exaggerates differences"},{"i":"S1.02.t02","c":"S1.02","k":"S1","y":1,"t":"TRAP","f":"Scaling an icon’s width and height by k makes it look k times bigger.","b":"FALSE — perceived size scales by \\(k^{2}\\), not k"},{"i":"S1.02.dsc01","c":"S1.02","k":"S1","y":1,"t":"DISCRIM","f":"Bar chart  \\(\\leftrightarrow\\)  Histogram","b":"Bar chart\n• Bars are separated\n• For categorical data\n• Height = frequency\n\nHistogram\n• Bars are adjacent\n• For numerical data in bins\n• Area \\(\\propto\\) frequency"},{"i":"S1.03.f01","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Sample mean \\(\\bar{x}\\) for raw data","b":"\\(\\frac{1}{n}\\sum x_{i}\\)"},{"i":"S1.03.f02","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Grouped-data mean using class marks \\(m_{i}\\) and frequencies \\(f_{i}\\)","b":"\\(\\frac{\\sum(f_{i} m_{i})}{\\sum(f_{i})}\\)"},{"i":"S1.03.f03","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Population variance \\(\\sigma ^{2}\\) (divisor N)","b":"\\(\\frac{1}{N}\\sum(x_{i}-\\mu )^{2}\\)"},{"i":"S1.03.f04","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Sample variance \\(s^{2}\\) (divisor n − 1)","b":"\\(\\frac{1}{n-1}\\sum(x_{i}-\\bar{x})^{2}\\)"},{"i":"S1.03.f05","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Computational form of the sample variance","b":"\\(\\frac{\\sum x_{i}^{2}-n \\bar{x}^{2}}{n-1}\\)"},{"i":"S1.03.f06","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Coefficient of variation","b":"\\(\\frac{s}{\\bar{x}}\\cdot 100\\%\\)"},{"i":"S1.03.f07","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"The \\(1.5\\cdot IQR\\) outlier fences","b":"Q1-1.5*IQR and Q3+1.5*IQR"},{"i":"S1.03.f08","c":"S1.03","k":"S1","y":3,"t":"FORMULA","f":"Under y = a + bx, give ȳ, \\(s_{y}\\) and \\(IQR_{y}\\)","b":"\\(\\bar{y}=a+b \\bar{x}, s_{y}=\\lvert b\\rvert s_{x}, IQR_{y}=\\lvert b\\rvert IQR_{x}\\)"},{"i":"S1.03.c01","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Right-skewed data orders the centres how?","b":"mode < median < mean"},{"i":"S1.03.c02","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Which measure of centre minimises \\(\\sum (x_{i} - c)^{2}\\)?","b":"the mean"},{"i":"S1.03.c03","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Which measure of centre minimises \\(\\sum \\lvert x_{i} - c\\rvert\\)?","b":"the median"},{"i":"S1.03.c04","c":"S1.03","k":"S1","y":3,"t":"CLASSIFY","f":"Boxplot whiskers extend to…","b":"the most extreme points inside the fences"},{"i":"S1.03.dsc01","c":"S1.03","k":"S1","y":3,"t":"DISCRIM","f":"Mean  \\(\\leftrightarrow\\)  Median","b":"Mean\n• Minimises \\(\\sum (x - c)^{2}\\)\n• Sensitive to outliers\n• Uses every value\n• Σ(xᵢ − this) = 0\n\nMedian\n• Minimises \\(\\sum \\lvert x - c\\rvert\\)\n• Resistant to outliers\n• Uses only the middle position\n• Available for ordinal data"},{"i":"S1.03.dsc02","c":"S1.03","k":"S1","y":3,"t":"DISCRIM","f":"Divisor n  \\(\\leftrightarrow\\)  Divisor n − 1","b":"Divisor n\n• Population variance \\(\\sigma ^{2}\\)\n• Biased downward as an estimator of \\(\\sigma ^{2}\\)\n• Used when \\(\\mu\\) is known\n\nDivisor n − 1\n• Sample variance \\(s^{2}\\)\n• Unbiased estimator of \\(\\sigma ^{2}\\)\n• Costs one degree of freedom for \\(\\bar{x}\\)"},{"i":"S1.03.d01","c":"S1.03","k":"S1","y":3,"t":"DERIVE","f":"Why divide by n − 1 in the sample variance?","b":"\\(\\bar{x}\\) is estimated from the same data, costing one degree of freedom; it makes \\(s^{2}\\) unbiased"},{"i":"S1.03.t01","c":"S1.03","k":"S1","y":3,"t":"TRAP","f":"Adding a constant to every value changes the standard deviation.","b":"FALSE — shifting changes location only; spread is unchanged"},{"i":"S1.04.f01","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Sample covariance of x and y","b":"\\(\\frac{1}{n-1}\\sum(x_{i}-\\bar{x})(y_{i}-\\bar{y})\\)"},{"i":"S1.04.f02","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Correlation r in terms of covariance and the two SDs","b":"\\(\\frac{\\operatorname{cov}(x,y)}{s_{x} s_{y}}\\)"},{"i":"S1.04.f03","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Least-squares slope \\(b_{1}\\) in terms of \\(r, s_{y}\\) and \\(s_{x}\\)","b":"\\(b_{1}=r\\cdot \\frac{s_{y}}{s_{x}}\\)"},{"i":"S1.04.f04","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Least-squares intercept \\(b_{0}\\)","b":"\\(b_{0}=\\bar{y}-b_{1}\\cdot \\bar{x}\\)"},{"i":"S1.04.f05","c":"S1.04","k":"S1","y":3,"t":"FORMULA","f":"Definition of the residual \\(e_{i}\\)","b":"\\(e_{i}=y_{i}-\\hat{y}_{i}\\)"},{"i":"S1.04.c01","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"The four things to read off a scatterplot are…","b":"direction, form, strength, outliers"},{"i":"S1.04.c02","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"\\(r^{2}\\) is interpreted as…","b":"the proportion of variation in y explained by the linear relation with x"},{"i":"S1.04.c03","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"Under \\(x'\\) = a + bx with b < 0, the correlation r…","b":"flips sign"},{"i":"S1.04.dsc01","c":"S1.04","k":"S1","y":3,"t":"DISCRIM","f":"Covariance  \\(\\leftrightarrow\\)  Correlation r","b":"Covariance\n• Units of \\(x \\times\\) units of y\n• Range \\((-\\infty , \\infty )\\)\n• Magnitude means nothing comparable\n• Scales by b under \\(x'\\) = a + bx\n\nCorrelation r\n• Unitless\n• Range [−1, 1]\n• Magnitude means strength of linear relation\n• Unchanged if b > 0"},{"i":"S1.04.t01","c":"S1.04","k":"S1","y":3,"t":"TRAP","f":"r = 0 means x and y have no relationship.","b":"FALSE — r measures linear association only — a perfect parabola gives r = 0"},{"i":"S1.04.t02","c":"S1.04","k":"S1","y":3,"t":"TRAP","f":"r is symmetric in x and y, and so is the regression slope.","b":"FALSE — r is symmetric but the regression slope is not"},{"i":"S1.04.co01","c":"S1.04","k":"S1","y":3,"t":"CONDITION","f":"Use the fitted line to predict y at an x far outside the observed range.","b":"REJECT — extrapolation outside the observed range of x is unjustified"},{"i":"S1.04.co02","c":"S1.04","k":"S1","y":3,"t":"CONDITION","f":"A strong correlation is reported, so the paper concludes x causes y.","b":"REJECT — correlation is not causation — confounding and lurking variables"},{"i":"S1.04.c04","c":"S1.04","k":"S1","y":3,"t":"CLASSIFY","f":"Two categorical variables look independent when…","b":"every conditional distribution matches the marginal"},{"i":"S1.05.f01","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Permutations of r from n distinct objects, \\(^{n}P_{r}\\)","b":"n!/(n-r)!"},{"i":"S1.05.f02","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Combinations of r from n distinct objects, \\(^{n}C_{r}\\)","b":"n!/(r!(n-r)!)"},{"i":"S1.05.f03","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Arrangements of n objects with repeats \\(n_{1}, n_{2}\\), …, \\(n_{k}\\)","b":"n!/(n1! \\(n_{2}\\)! ... nk!)"},{"i":"S1.05.f04","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"r selections from n types, repetition allowed, order does NOT matter","b":"\\(\\binom{n+r-1}{r}\\)"},{"i":"S1.05.f05","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"r selections from n types, repetition allowed, order MATTERS","b":"\\(n^{r}\\)"},{"i":"S1.05.f06","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Circular arrangements of n distinct objects","b":"\\((n-1)!\\)"},{"i":"S1.05.f07","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Pascal’s identity: C(n,r) + C(n,r−1) = ?","b":"\\(\\binom{n+1}{r}\\)"},{"i":"S1.05.f08","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Sum of all binomial coefficients \\(\\sum \\binom{n}{r}\\) for r = 0…n","b":"\\(2^{n}\\)"},{"i":"S1.05.f09","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"Binomial theorem: \\((a + b)^{n}\\) = ?","b":"\\(\\sum_{r=0}^{n} \\binom{n}{r} a^{n-r} b^{r}\\)"},{"i":"S1.05.f10","c":"S1.05","k":"S1","y":3,"t":"FORMULA","f":"The (r+1)-th term of the binomial expansion of \\((a + b)^{n}\\)","b":"\\(\\binom{n}{r} a^{n-r} b^{r}\\)"},{"i":"S1.05.dsc01","c":"S1.05","k":"S1","y":3,"t":"DISCRIM","f":"Permutation  \\(\\leftrightarrow\\)  Combination","b":"Permutation\n• Order matters\n• n!/(n−r)!\n• Swapping two chosen items gives a new outcome\n• Arranging books on a shelf\n\nCombination\n• Order does not matter\n• n!/(r!(n−r)!)\n• Swapping two chosen items gives the same outcome\n• Choosing a committee"},{"i":"S1.05.ch01","c":"S1.05","k":"S1","y":3,"t":"CHAIN","f":"Counting arrangements where certain items must stay together — order the method","b":"1. Glue the joined items into a single block\n2. Arrange the blocks together with the remaining items\n3. Arrange the items within the block\n4. Multiply the two counts"},{"i":"S1.05.t01","c":"S1.05","k":"S1","y":3,"t":"TRAP","f":"“At least one” problems are usually easiest computed directly.","b":"FALSE — use 1 − P(none) — the complement is almost always easier"},{"i":"S1.05.c01","c":"S1.05","k":"S1","y":3,"t":"CLASSIFY","f":"Items that must be SEPARATED are handled by…","b":"arranging the others first, then placing into the gaps"},{"i":"S1.06.f01","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Kolmogorov’s three axioms, stated compactly","b":"\\(P(A)\\ge 0; P(S)=1\\); countable additivity for disjoint events"},{"i":"S1.06.f02","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Complement rule: \\(P(A^{c})\\) = ?","b":"\\(1-P(A)\\)"},{"i":"S1.06.f03","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Addition rule for two events","b":"\\(P(A)+P(B)-P(A\\cap B)\\)"},{"i":"S1.06.f04","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"P(A \\ B) in terms of P(A) and \\(P(A \\cap B)\\)","b":"\\(P(A)-P(A\\cap B)\\)"},{"i":"S1.06.f05","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Boole’s inequality","b":"P(union A_i)<=sum P(A_i)"},{"i":"S1.06.f06","c":"S1.06","k":"S1","y":2,"t":"FORMULA","f":"Equally likely outcomes: P(A) = ?","b":"\\(\\frac{\\lvert A\\rvert }{\\lvert S\\rvert }\\)"},{"i":"S1.06.t01","c":"S1.06","k":"S1","y":2,"t":"TRAP","f":"Mutually exclusive events with positive probability are independent.","b":"FALSE — they are necessarily dependent — knowing A occurred tells you B did not"},{"i":"S1.06.t02","c":"S1.06","k":"S1","y":2,"t":"TRAP","f":"For the sum of two dice, the outcomes {2,…,12} are equally likely.","b":"FALSE — the sample space is not symmetric — the 36 ordered pairs are"},{"i":"S1.06.dsc01","c":"S1.06","k":"S1","y":2,"t":"DISCRIM","f":"Mutually exclusive  \\(\\leftrightarrow\\)  Independent","b":"Mutually exclusive\n• \\(A \\cap B = \\varnothing\\)\n• Cannot both occur\n• \\(P(A \\cup B) = P(A) + P(B)\\)\n\nIndependent\n• \\(P(A \\cap B) = P(A)P(B)\\)\n• Occurrence of one says nothing about the other\n• \\(P(A \\mid B) = P(A)\\)"},{"i":"S1.07.f01","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Definition of conditional probability P(A | B)","b":"\\(\\frac{P(A\\cap B)}{P(B)}\\)"},{"i":"S1.07.f02","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Multiplication rule for \\(P(A \\cap B)\\), both orderings","b":"\\(P(B)P(A \\mid B)=P(A)P(B \\mid A)\\)"},{"i":"S1.07.f03","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Chain rule for P(A₁ ∩ … ∩ Aₙ)","b":"\\(P(A_{1})P(A_{2} \\mid A_{1})\\dots P(An \\mid A_{1}\\cap \\dots \\cap A_{n-1})\\)"},{"i":"S1.07.f04","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Independence of A and B, stated two ways","b":"\\(P(A\\cap B)=P(A)P(B)\\); equivalently \\(P(A \\mid B)=P(A)\\)"},{"i":"S1.07.f05","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Law of total probability over a partition \\(B_{1}\\dots B_{k}\\)","b":"\\(P(A)=\\sum P(B_{i})P(A \\mid B_{i})\\)"},{"i":"S1.07.f06","c":"S1.07","k":"S1","y":3,"t":"FORMULA","f":"Bayes’ rule for \\(P(B_{j} \\mid A)\\)","b":"\\(\\frac{P(B_{j})P(A \\mid B_{j})}{\\sum_{i} P(B_{i})P(A \\mid B_{i})}\\)"},{"i":"S1.07.c01","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"In Bayes’ rule, \\(P(A \\mid B_{j})\\) is called the…","b":"likelihood"},{"i":"S1.07.c02","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"If A and B are independent, which pair is NOT guaranteed independent?","b":"none — \\(A^{c}\\&B, A\\&B^{c}, A^{c}\\&B^{c}\\) are all independent"},{"i":"S1.07.t01","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"\\(P(A \\mid B) = P(B \\mid A)\\).","b":"FALSE — reversing the conditioning is the single most common error in the paper"},{"i":"S1.07.t02","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"Pairwise independence of \\(A_{1}\\dots A_{n}\\) implies mutual independence.","b":"FALSE — mutual independence needs the product rule for every sub-collection"},{"i":"S1.07.t03","c":"S1.07","k":"S1","y":3,"t":"TRAP","f":"A rare condition with a highly accurate test still gives a low posterior.","b":"TRUE — the base rate dominates when the prior is small"},{"i":"S1.07.ch01","c":"S1.07","k":"S1","y":3,"t":"CHAIN","f":"The handbook’s recommended method for any two-way Bayes problem","b":"1. Build a \\(2\\times 2\\) contingency table with a convenient total (say 10,000)\n2. Fill in the cells from the prior and the likelihoods\n3. Read the relevant row or column total\n4. Divide the cell by that total — Bayes becomes division"},{"i":"S1.07.c03","c":"S1.07","k":"S1","y":3,"t":"CLASSIFY","f":"Conditioning on B does what to the sample space?","b":"restricts it to B and rescales"},{"i":"M2.01.f01","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Dot product of u and v, in sum and matrix notation","b":"\\(\\sum u_{i} v_{i} = u^{T} v\\)"},{"i":"M2.01.f02","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Angle between two vectors: \\(\\cos \\theta\\) = ?","b":"\\(\\frac{u\\cdot v}{\\|u\\| \\|v\\|}\\)"},{"i":"M2.01.f03","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Transpose of a product: \\((AB)^{T}\\) = ?","b":"\\(B^{T} A^{T}\\)"},{"i":"M2.01.f04","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Inverse of a product: \\((AB)^{-1}\\) = ?","b":"\\(B^{-1} A^{-1}\\)"},{"i":"M2.01.f05","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Entry (i,j) of the matrix product AB","b":"\\(\\sum_{k} a_{ik} b_{kj}\\)"},{"i":"M2.01.f06","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Trace identity relating \\(\\operatorname{tr}(AB)\\) and \\(\\operatorname{tr}(BA)\\)","b":"\\(\\operatorname{tr}(AB)=\\operatorname{tr}(BA)\\)"},{"i":"M2.01.f07","c":"M2.01","k":"M2","y":2,"t":"FORMULA","f":"Split any square A uniquely into symmetric + skew parts","b":"\\(A=\\frac{1}{2}(A+A^{T})+\\frac{1}{2}(A-A^{T})\\)"},{"i":"M2.01.c01","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"An orthogonal matrix satisfies…","b":"\\(A^{T}A = I\\), so \\(A^{-1} = A^{T}\\)"},{"i":"M2.01.c02","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"A skew-symmetric matrix has which diagonal entries?","b":"all zero"},{"i":"M2.01.c03","c":"M2.01","k":"M2","y":2,"t":"CLASSIFY","f":"Idempotent means…","b":"\\(A^{2} = A\\)"},{"i":"M2.01.t01","c":"M2.01","k":"M2","y":2,"t":"TRAP","f":"AB = 0 implies A = 0 or B = 0.","b":"FALSE — matrices have zero divisors — neither factor need vanish"},{"i":"M2.01.t02","c":"M2.01","k":"M2","y":2,"t":"TRAP","f":"AB = AC implies B = C.","b":"FALSE — cancellation requires A to be invertible"},{"i":"M2.02.f01","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"The three elementary row operations","b":"swap rows; scale a row by \\(c\\ne 0\\); add a multiple of one row to another"},{"i":"M2.02.f02","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"Structure of the solution set of Ax = b","b":"\\(x_{p} + N(A)\\)"},{"i":"M2.02.c01","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"\\(\\operatorname{rank}(A) < \\operatorname{rank}([A \\mid b])\\) means the system has…","b":"no solution"},{"i":"M2.02.c02","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"\\(\\operatorname{rank}(A) = \\operatorname{rank}([A \\mid b]) = n\\) (number of unknowns) means…","b":"a unique solution"},{"i":"M2.02.c03","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"\\(\\operatorname{rank}(A) = \\operatorname{rank}([A \\mid b]) = r < n\\) means infinitely many solutions with how many free parameters?","b":"n − r"},{"i":"M2.02.c04","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"A homogeneous system Ax = 0 has a non-trivial solution exactly when…","b":"\\(\\operatorname{rank}(A) < n\\)"},{"i":"M2.02.c05","c":"M2.02","k":"M2","y":3,"t":"CLASSIFY","f":"The RREF of a matrix is…","b":"unique"},{"i":"M2.02.ch01","c":"M2.02","k":"M2","y":3,"t":"CHAIN","f":"Gauss–Jordan: from a system to its full solution set","b":"1. Write the augmented matrix [A | b]\n2. Row-reduce to reduced row echelon form\n3. Identify pivot columns (basic variables) and non-pivot columns (free variables)\n4. Set each free variable to a parameter\n5. Express the basic variables in terms of those parameters"},{"i":"M2.02.ch02","c":"M2.02","k":"M2","y":3,"t":"CHAIN","f":"Finding an inverse by row reduction","b":"1. Form the augmented block [A | I]\n2. Row-reduce the left block toward I\n3. If a zero row appears on the left, stop — A is singular\n4. Otherwise read the inverse off the right block: [I | A⁻¹]"},{"i":"M2.02.f03","c":"M2.02","k":"M2","y":3,"t":"FORMULA","f":"List four equivalent statements to “A \\((n\\times n)\\) is invertible”","b":"\\(\\det A\\ne 0; \\operatorname{rank} A=n\\); RREF is \\(I; Ax=0\\) has only the trivial solution"},{"i":"M2.02.co01","c":"M2.02","k":"M2","y":3,"t":"CONDITION","f":"Row operations were applied, then the column space was read off the reduced matrix’s columns.","b":"REJECT — row operations change the column space — use the ORIGINAL matrix’s pivot columns"},{"i":"M2.02.t01","c":"M2.02","k":"M2","y":3,"t":"TRAP","f":"A homogeneous system with more unknowns than equations always has a non-trivial solution.","b":"TRUE — m < n forces \\(\\operatorname{rank}(A) < n\\), so free variables exist"},{"i":"M2.03.f01","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Determinant of a \\(2\\times 2\\) matrix [[a,b],[c,d]]","b":"\\(ad-bc\\)"},{"i":"M2.03.f02","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Cofactor \\(C_{ij}\\) in terms of the minor \\(M_{ij}\\)","b":"\\((-1)^{i+j} M_{ij}\\)"},{"i":"M2.03.f03","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"\\(\\det (kA)\\) for an \\(n\\times n\\) matrix","b":"\\(k^{n} \\det A\\)"},{"i":"M2.03.f04","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Inverse via the adjugate","b":"\\(A^{-1}=\\frac{1}{\\det A} \\operatorname{adj}(A)\\)"},{"i":"M2.03.f05","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Cramer’s rule for \\(x_{i}\\)","b":"\\(x_{i}=\\frac{\\det (A_{i})}{\\det (A)}\\)"},{"i":"M2.03.f06","c":"M2.03","k":"M2","y":2,"t":"FORMULA","f":"Determinant of a triangular or diagonal matrix","b":"product of the diagonal entries"},{"i":"M2.03.c01","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Adding a multiple of one row to another does what to the determinant?","b":"leaves it unchanged"},{"i":"M2.03.c02","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Swapping two rows does what to the determinant?","b":"flips its sign"},{"i":"M2.03.c03","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"Geometrically, |det A| is…","b":"the factor by which A scales area or volume"},{"i":"M2.03.t01","c":"M2.03","k":"M2","y":2,"t":"TRAP","f":"\\(\\det (A + B) = \\det A + \\det B\\).","b":"FALSE — the determinant is multiplicative, not additive"},{"i":"M2.03.co01","c":"M2.03","k":"M2","y":2,"t":"CONDITION","f":"Apply Cramer’s rule to a \\(3\\times 4\\) system.","b":"REJECT — Cramer’s rule needs a square, non-singular system — row-reduce instead"},{"i":"M2.03.c04","c":"M2.03","k":"M2","y":2,"t":"CLASSIFY","f":"A zero determinant means the transformation…","b":"collapses space into a lower dimension"},{"i":"M2.04.f01","c":"M2.04","k":"M2","y":2,"t":"FORMULA","f":"The three-part subspace test","b":"\\(0\\in W\\); closed under addition; closed under scalar multiplication"},{"i":"M2.04.f02","c":"M2.04","k":"M2","y":2,"t":"FORMULA","f":"Dimension formula for the sum of two subspaces","b":"\\(\\dim (U+W)=\\dim U+\\dim W-\\dim (U\\cap W)\\)"},{"i":"M2.04.c01","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"dim of \\(M_{m\\times n}\\), the space of \\(m\\times n\\) matrices, is…","b":"mn"},{"i":"M2.04.c02","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"dim of \\(P_{n}\\), polynomials of degree \\(\\le n\\), is…","b":"n + 1"},{"i":"M2.04.c03","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"The span of a set of vectors is…","b":"the smallest subspace containing them"},{"i":"M2.04.t01","c":"M2.04","k":"M2","y":2,"t":"TRAP","f":"The union of two subspaces is a subspace.","b":"FALSE — the union generally fails closure under addition; the intersection is fine"},{"i":"M2.04.co01","c":"M2.04","k":"M2","y":2,"t":"CONDITION","f":"A plane in \\(\\mathbb{R}^{3}\\) that does not pass through the origin is proposed as a subspace.","b":"REJECT — it fails to contain 0 — it is an affine subspace, not a subspace"},{"i":"M2.04.c04","c":"M2.04","k":"M2","y":2,"t":"CLASSIFY","f":"The solution set of a HOMOGENEOUS system is…","b":"a subspace"},{"i":"M2.05.f01","c":"M2.05","k":"M2","y":2,"t":"FORMULA","f":"Definition of linear independence","b":"\\(c_{1} v_{1}+\\dots +c_{k} v_{k}=0\\) implies all \\(c_{i}=0\\)"},{"i":"M2.05.c01","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"Any set containing the zero vector is…","b":"dependent"},{"i":"M2.05.c02","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"More than n vectors in \\(\\mathbb{R}^{n}\\) are…","b":"always dependent"},{"i":"M2.05.c03","c":"M2.05","k":"M2","y":2,"t":"CLASSIFY","f":"Vectors as columns of A are independent exactly when…","b":"every column is a pivot column"},{"i":"M2.05.co01","c":"M2.05","k":"M2","y":2,"t":"CONDITION","f":"To identify an independent subset of the ORIGINAL vectors, they were placed in rows and reduced.","b":"REJECT — put them in columns — pivot columns identify original vectors; rows only give a basis for the span"},{"i":"M2.05.t01","c":"M2.05","k":"M2","y":2,"t":"TRAP","f":"Any subset of an independent set is independent.","b":"TRUE — independence is inherited by subsets; dependence is inherited by supersets"},{"i":"M2.06.f01","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Definition of a basis","b":"linearly independent and spans V"},{"i":"M2.06.f02","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"\\(\\operatorname{rank}(A)\\) equals which three things?","b":"dim row space = dim column space = number of pivots in RREF"},{"i":"M2.06.f03","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Reading a ROW SPACE basis off the RREF","b":"the non-zero rows of the RREF"},{"i":"M2.06.f04","c":"M2.06","k":"M2","y":3,"t":"FORMULA","f":"Reading a COLUMN SPACE basis off the RREF","b":"the columns of the ORIGINAL A in the pivot positions"},{"i":"M2.06.c01","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"In a space of dimension n, any n independent vectors…","b":"form a basis"},{"i":"M2.06.c02","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"\\(\\operatorname{rank}(A)\\) is bounded above by…","b":"\\(\\min (m, n)\\)"},{"i":"M2.06.c03","c":"M2.06","k":"M2","y":3,"t":"CLASSIFY","f":"dim{0}, the zero subspace, is…","b":"0"},{"i":"M2.06.dsc01","c":"M2.06","k":"M2","y":3,"t":"DISCRIM","f":"Row space  \\(\\leftrightarrow\\)  Column space","b":"Row space\n• Preserved by row operations\n• Lives in \\(\\mathbb{R}^{n}\\)\n• Basis = non-zero rows of the RREF\n• Its orthogonal complement is the null space\n\nColumn space\n• Changed by row operations\n• Lives in \\(\\mathbb{R}^{m}\\)\n• Basis = pivot columns of the ORIGINAL matrix\n• Equals the image of the map \\(x \\mapsto Ax\\)"},{"i":"M2.06.t01","c":"M2.06","k":"M2","y":3,"t":"TRAP","f":"Row rank can differ from column rank.","b":"FALSE — row rank always equals column rank"},{"i":"M2.07.f01","c":"M2.07","k":"M2","y":3,"t":"FORMULA","f":"The rank–nullity theorem","b":"\\(\\operatorname{rank}(A)+\\operatorname{nullity}(A)=n\\)"},{"i":"M2.07.f02","c":"M2.07","k":"M2","y":3,"t":"FORMULA","f":"Definition of the null space N(A)","b":"\\(\\{x: Ax=0\\}\\)"},{"i":"M2.07.c01","c":"M2.07","k":"M2","y":3,"t":"CLASSIFY","f":"The nullity equals the number of…","b":"free variables"},{"i":"M2.07.ch01","c":"M2.07","k":"M2","y":3,"t":"CHAIN","f":"Finding a basis for the null space N(A)","b":"1. Reduce A to RREF\n2. Identify pivot columns and free columns\n3. Write each basic variable in terms of the free variables\n4. Set one free variable to 1 and the rest to 0, in turn\n5. Collect one basis vector per free variable"},{"i":"M2.07.d01","c":"M2.07","k":"M2","y":3,"t":"DERIVE","f":"State the one-line proof of rank–nullity.","b":"every column is either a pivot column \\((\\operatorname{rank})\\) or a free column \\((\\operatorname{nullity})\\)"},{"i":"M2.07.t01","c":"M2.07","k":"M2","y":3,"t":"TRAP","f":"The null-space basis vectors produced by the free-variable method are automatically independent.","b":"TRUE — each has a 1 where the others have 0"},{"i":"M2.08.f01","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"The linearity condition, in one combined equation","b":"\\(T(au+bv)=aT(u)+bT(v)\\)"},{"i":"M2.08.f02","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"Rank–nullity for a linear map \\(T : V \\to W\\)","b":"\\(\\dim (\\ker T)+\\dim (\\operatorname{im} T)=\\dim V\\)"},{"i":"M2.08.f03","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"How the matrix [T] is built from a basis of V","b":"its j-th column is \\([T(v_{j})]_{C}\\)"},{"i":"M2.08.f04","c":"M2.08","k":"M2","y":3,"t":"FORMULA","f":"Similar matrices — the defining relation","b":"\\(B=P^{-1} A P\\)"},{"i":"M2.08.c01","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"T is injective exactly when…","b":"ker T = {0}"},{"i":"M2.08.c02","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"A fast disqualifying test for linearity is…","b":"check \\(T(0) = 0\\)"},{"i":"M2.08.c03","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"Similar matrices share all of the following EXCEPT…","b":"their entries"},{"i":"M2.08.c04","c":"M2.08","k":"M2","y":3,"t":"CLASSIFY","f":"An affine map \\(x \\mapsto Ax + b\\) is linear exactly when…","b":"b = 0"},{"i":"M2.08.dsc01","c":"M2.08","k":"M2","y":3,"t":"DISCRIM","f":"Kernel  \\(\\leftrightarrow\\)  Image","b":"Kernel\n• \\(\\{v : T(v) = 0\\}\\)\n• A subspace of V\n• Its dimension is the nullity\n• Equals N(A) for \\(T(x) = Ax\\)\n\nImage\n• \\(\\{T(v) : v \\in V\\}\\)\n• A subspace of W\n• Its dimension is the rank\n• Equals C(A) for \\(T(x) = Ax\\)"},{"i":"M2.08.dsc02","c":"M2.08","k":"M2","y":3,"t":"DISCRIM","f":"Similar matrices  \\(\\leftrightarrow\\)  Equivalent matrices","b":"Similar matrices\n• \\(B = P^{-1}AP\\)\n• Same transformation, different basis\n• Share trace and eigenvalues\n\nEquivalent matrices\n• B = QAP with P, Q invertible\n• Same rank — and that is all\n• Need not share eigenvalues"},{"i":"M2.08.t01","c":"M2.08","k":"M2","y":3,"t":"TRAP","f":"For dim V = dim W finite, injective and surjective are equivalent for a linear map.","b":"TRUE — rank–nullity forces one from the other when the dimensions match"},{"i":"M2.09.f01","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"The three inner-product axioms (real case)","b":"symmetry; bilinearity; positive definiteness"},{"i":"M2.09.f02","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Cauchy–Schwarz inequality","b":"\\(\\lvert \\langle u,v\\rangle \\rvert \\le \\|u\\| \\|v\\|\\)"},{"i":"M2.09.f03","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"The parallelogram law","b":"\\(\\|u+v\\|^{2}+\\|u-v\\|^{2}=2\\|u\\|^{2}+2\\|v\\|^{2}\\)"},{"i":"M2.09.f04","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Definition of the orthogonal complement \\(U\\perp\\)","b":"{v: <v,u>=0 for all u in U}"},{"i":"M2.09.f05","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"Dimension relation for a subspace and its complement","b":"\\(\\dim U+\\dim U^{\\perp}=\\dim V\\)"},{"i":"M2.09.f06","c":"M2.09","k":"M2","y":2,"t":"FORMULA","f":"For a matrix, N(A) is the orthogonal complement of which space?","b":"the row space"},{"i":"M2.09.c01","c":"M2.09","k":"M2","y":2,"t":"CLASSIFY","f":"Cauchy–Schwarz holds with equality exactly when u and v are…","b":"parallel"},{"i":"M2.09.t01","c":"M2.09","k":"M2","y":2,"t":"TRAP","f":"A set of non-zero pairwise orthogonal vectors is linearly independent.","b":"TRUE — pairing \\(\\sum c_{i}v_{i} = 0\\) with \\(v_{j}\\) kills every term but \\(c_{j}\\|v_{j}\\|^{2}\\)"},{"i":"M2.09.t02","c":"M2.09","k":"M2","y":2,"t":"TRAP","f":"Linearly independent vectors are automatically orthogonal.","b":"FALSE — the converse of “orthogonal \\(\\Rightarrow\\) independent” fails"},{"i":"M2.10.f01","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection of v onto a single vector u","b":"\\(\\frac{\\langle v,u\\rangle }{\\langle u,u\\rangle }u\\)"},{"i":"M2.10.f02","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection of v onto a subspace with orthonormal basis \\(\\{q_{i}\\}\\)","b":"\\(\\sum_{i} \\langle v,q_{i}\\rangle q_{i}\\)"},{"i":"M2.10.f03","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Projection matrix onto C(A) when A has independent columns","b":"\\(P=A(A^{T} A)^{-1} A^{T}\\)"},{"i":"M2.10.f04","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The two properties characterising an orthogonal projection matrix","b":"\\(P^{2}=P\\) and \\(P^{T}=P\\)"},{"i":"M2.10.f05","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The normal equations for least squares","b":"\\(A^{T} A \\hat{x}=A^{T} b\\)"},{"i":"M2.10.f06","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"The Gram–Schmidt step for \\(w_{j}\\)","b":"\\(w_{j}=v_{j}-\\sum_{i<j}\\frac{\\langle v_{j},w_{i}\\rangle }{\\langle w_{i},w_{i}\\rangle }w_{i}\\)"},{"i":"M2.10.f07","c":"M2.10","k":"M2","y":3,"t":"FORMULA","f":"Coordinates of v in an orthonormal basis (Parseval form)","b":"\\(v=\\sum \\langle v,q_{i}\\rangle q_{i}\\)"},{"i":"M2.10.c01","c":"M2.10","k":"M2","y":3,"t":"CLASSIFY","f":"\\(\\operatorname{proj}_{U}(v)\\) is characterised geometrically as…","b":"the unique closest point of U to v"},{"i":"M2.10.co01","c":"M2.10","k":"M2","y":3,"t":"CONDITION","f":"In Gram–Schmidt, projections are subtracted onto the ORIGINAL vectors \\(v_{i}\\).","b":"REJECT — subtract projections onto the already-orthogonalised \\(w_{i}\\)"},{"i":"M2.10.co02","c":"M2.10","k":"M2","y":3,"t":"CONDITION","f":"Each Gram–Schmidt vector is normalised immediately, before computing the next one.","b":"REJECT — normalise at the very end, or carry fractions through the whole computation"},{"i":"M2.10.ch01","c":"M2.10","k":"M2","y":3,"t":"CHAIN","f":"Gram–Schmidt, correctly ordered","b":"1. Set \\(w_{1} = v_{1}\\)\n2. For each subsequent \\(v_{j}\\), compute its projections onto every previous \\(w_{i}\\)\n3. Subtract those projections to get \\(w_{j}\\)\n4. Repeat until all vectors are processed\n5. Normalise each \\(w_{j}\\) to \\(q_{j} = \\frac{w_{j}}{\\|w_{j}\\|}\\) at the end"},{"i":"M2.10.t01","c":"M2.10","k":"M2","y":3,"t":"TRAP","f":"If a Gram–Schmidt \\(w_{j}\\) comes out zero, the original set was dependent.","b":"TRUE — \\(v_{j}\\) lay in the span of the earlier vectors"},{"i":"M2.11.f01","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"2D rotation matrix by angle \\(\\theta\\)","b":"[[cos \\(t,-\\sin\\) t],[sin t,cos t]]"},{"i":"M2.11.f02","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"Reflection in the line through the origin at angle \\(\\theta\\)","b":"[[cos 2t,sin 2t],[sin 2t,-cos 2t]]"},{"i":"M2.11.c01","c":"M2.11","k":"M2","y":1,"t":"CLASSIFY","f":"det Q = +1 for an orthogonal Q means it is a…","b":"rotation"},{"i":"M2.11.c02","c":"M2.11","k":"M2","y":1,"t":"CLASSIFY","f":"Orthogonal transformations preserve…","b":"lengths, angles and distances"},{"i":"M2.11.f03","c":"M2.11","k":"M2","y":1,"t":"FORMULA","f":"Composition and inverse of rotations","b":"\\(R_{a} R_{b}=R_{a+b}, R_{t}^{-1}=R_{-t}\\)"},{"i":"M2.12.c01","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"A level curve of f(x,y) is the set…","b":"\\(f(x,y) = c\\)"},{"i":"M2.12.c02","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"Closely spaced contours indicate…","b":"a steep region"},{"i":"M2.12.c03","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"\\(z = x^{2} - y^{2}\\) is which surface?","b":"a saddle, with hyperbolic contours"},{"i":"M2.12.c04","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"\\(z = x^{2} + y^{2}\\) is which surface?","b":"a paraboloid, with circular contours"},{"i":"M2.12.f01","c":"M2.12","k":"M2","y":1,"t":"FORMULA","f":"The gradient \\(\\nabla f\\) and its geometric meaning","b":"\\((\\frac{df}{dx},\\frac{df}{dy})\\); perpendicular to the level curve, points of steepest increase"},{"i":"M2.12.c05","c":"M2.12","k":"M2","y":1,"t":"CLASSIFY","f":"\\(\\partial \\frac{f}{\\partial x}\\) is computed by…","b":"differentiating in x while treating y as constant"},{"i":"S2.01.f01","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Marginal PMF of X from the joint PMF","b":"\\(p_{X}(x)=\\sum_{y} p(x,y)\\)"},{"i":"S2.01.f02","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Conditional PMF p(x | y)","b":"\\(\\frac{p(x,y)}{p_{Y}(y)}\\)"},{"i":"S2.01.f03","c":"S2.01","k":"S2","y":2,"t":"FORMULA","f":"Independence of X and Y for discrete variables","b":"\\(p(x,y)=p_{X}(x)p_{Y}(y)\\) for all (x,y)"},{"i":"S2.01.co01","c":"S2.01","k":"S2","y":2,"t":"CONDITION","f":"Independence is claimed for a joint PMF whose support is \\(\\{(x,y) : x \\le y\\}\\).","b":"REJECT — a non-rectangular support rules out independence whatever the formula looks like"},{"i":"S2.01.t01","c":"S2.01","k":"S2","y":2,"t":"TRAP","f":"The marginals determine the joint distribution.","b":"FALSE — only if independence is additionally assumed"},{"i":"S2.01.c01","c":"S2.01","k":"S2","y":2,"t":"CLASSIFY","f":"For n variables, mutual independence requires…","b":"the full factorisation \\(p(x_{1}\\dots x_{n}) = \\prod p(x_{i})\\)"},{"i":"S2.02.f01","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"PMF of \\(Y = g(X)\\) for discrete X","b":"\\(p_{Y}(y)=\\sum_{x:g(x)=y} p_{X}(x)\\)"},{"i":"S2.02.f02","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"Discrete convolution for the sum of independent X and Y","b":"\\(p_{X+Y}(z)=\\sum_{x} p_{X}(x)p_{Y}(z-x)\\)"},{"i":"S2.02.f03","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"CDF of the maximum of independent X and Y","b":"\\(F_{X}(z)F_{Y}(z)\\)"},{"i":"S2.02.f04","c":"S2.02","k":"S2","y":1,"t":"FORMULA","f":"CDF of the minimum of independent X and Y","b":"\\(1-(1-F_{X}(z))(1-F_{Y}(z))\\)"},{"i":"S2.02.co01","c":"S2.02","k":"S2","y":1,"t":"CONDITION","f":"For the distribution of \\(\\max (X,Y)\\), work directly with the PMF rather than the CDF.","b":"REJECT — go through the CDF — “max \\(\\le\\) z” is a clean event, “max = z” is not"},{"i":"S2.02.c01","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"Binomial(m,p) + Binomial(n,p), independent, equals…","b":"Binomial(m+n, p)"},{"i":"S2.02.c02","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"\\(\\operatorname{Poisson}(\\lambda _{1}) + \\operatorname{Poisson}(\\lambda _{2})\\), independent, equals…","b":"\\(\\operatorname{Poisson}(\\lambda _{1}+\\lambda _{2})\\)"},{"i":"S2.02.c03","c":"S2.02","k":"S2","y":1,"t":"CLASSIFY","f":"When g is many-to-one \\((e.g. X^{2})\\), probabilities…","b":"merge across preimages"},{"i":"S2.03.f01","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"LOTUS — expectation of g(X) without finding its distribution","b":"\\(E[g(X)]=\\sum g(x)p(x)\\)"},{"i":"S2.03.f02","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Linearity of expectation (no independence needed)","b":"\\(E[aX+bY+c]=aE[X]+bE[Y]+c\\)"},{"i":"S2.03.f03","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Computational formula for the variance","b":"\\(\\operatorname{Var}(X)=E[X^{2}]-(E[X])^{2}\\)"},{"i":"S2.03.f04","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"\\(\\operatorname{Var}(aX + b)\\) = ?","b":"\\(a^{2} \\operatorname{Var}(X)\\)"},{"i":"S2.03.f05","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Covariance in computational form","b":"\\(\\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]\\)"},{"i":"S2.03.f06","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"\\(\\operatorname{Var}(X \\pm Y)\\) in full","b":"\\(\\operatorname{Var}(X)+\\operatorname{Var}(Y)\\pm 2\\operatorname{Cov}(X,Y)\\)"},{"i":"S2.03.f07","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"\\(\\operatorname{Var}(\\sum a_{i}X_{i})\\) in general","b":"\\(\\sum a_{i}^{2} \\operatorname{Var}(X_{i})+2 \\sum_{i<j} a_{i} a_{j} \\operatorname{Cov}(X_{i},X_{j})\\)"},{"i":"S2.03.f08","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Correlation \\(\\rho\\) in terms of covariance and SDs","b":"\\(\\frac{\\operatorname{Cov}(X,Y)}{\\sigma _{X} \\sigma _{Y}}\\)"},{"i":"S2.03.f09","c":"S2.03","k":"S2","y":3,"t":"FORMULA","f":"Bilinearity: \\(\\operatorname{Cov}(aX + b, cY + d)\\) = ?","b":"\\(ac \\operatorname{Cov}(X,Y)\\)"},{"i":"S2.03.c01","c":"S2.03","k":"S2","y":3,"t":"CLASSIFY","f":"E[XY] = E[X]E[Y] requires…","b":"independence"},{"i":"S2.03.c02","c":"S2.03","k":"S2","y":3,"t":"CLASSIFY","f":"\\(\\lvert \\rho \\rvert = 1\\) exactly when…","b":"Y is an exact linear function of X"},{"i":"S2.03.t01","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"Uncorrelated implies independent.","b":"FALSE — independent \\(\\Rightarrow\\) uncorrelated, but not conversely — \\(e.g. Y = X^{2}\\) with X symmetric"},{"i":"S2.03.t02","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"\\(E[g(X)] = g(E[X]).\\)","b":"FALSE — this holds only when g is linear"},{"i":"S2.03.t03","c":"S2.03","k":"S2","y":3,"t":"TRAP","f":"\\(\\operatorname{Var}(X + Y) = \\operatorname{Var}(X) + \\operatorname{Var}(Y)\\) for any X and Y.","b":"FALSE — additive only when the covariance term vanishes"},{"i":"S2.04.f01","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Markov’s inequality (X ≥ 0, a > 0)","b":"\\(P(X\\ge a)\\le \\frac{E[X]}{a}\\)"},{"i":"S2.04.f02","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Chebyshev’s inequality in k-sigma form","b":"\\(P(\\lvert X-\\mu \\rvert \\ge k \\sigma )\\le \\frac{1}{k^{2}}\\)"},{"i":"S2.04.f03","c":"S2.04","k":"S2","y":2,"t":"FORMULA","f":"Chebyshev’s inequality in epsilon form","b":"\\(P(\\lvert X-\\mu \\rvert \\ge eps)\\le \\sigma \\frac{^{2}}{eps^{2}}\\)"},{"i":"S2.04.c01","c":"S2.04","k":"S2","y":2,"t":"CLASSIFY","f":"Chebyshev guarantees at least what fraction within 2 SDs?","b":"75%"},{"i":"S2.04.c02","c":"S2.04","k":"S2","y":2,"t":"CLASSIFY","f":"Chebyshev guarantees at least what fraction within 3 SDs?","b":"89%"},{"i":"S2.04.d01","c":"S2.04","k":"S2","y":2,"t":"DERIVE","f":"How is Chebyshev derived from Markov?","b":"apply Markov to \\((X-\\mu )^{2}\\)"},{"i":"S2.04.ch01","c":"S2.04","k":"S2","y":2,"t":"CHAIN","f":"From Markov to the weak law of large numbers","b":"1. Markov’s inequality for a non-negative variable\n2. Apply it to \\((X - \\mu )^{2}\\) to obtain Chebyshev\n3. Apply Chebyshev to \\(\\bar{X}_{n}\\), whose variance is \\(\\sigma \\frac{^{2}}{n}\\)\n4. Let \\(n \\to \\infty\\): the bound \\(\\sigma \\frac{^{2}}{n\\epsilon ^{2}} \\to 0\\), giving the WLLN"},{"i":"S2.04.co01","c":"S2.04","k":"S2","y":2,"t":"CONDITION","f":"Use Chebyshev to answer a question that names the distribution as Normal(10, 4).","b":"REJECT — a named distribution should be computed exactly — Chebyshev is for the distribution-free case"},{"i":"S2.04.dsc01","c":"S2.04","k":"S2","y":2,"t":"DISCRIM","f":"Markov  \\(\\leftrightarrow\\)  Chebyshev","b":"Markov\n• Requires \\(X \\ge 0\\)\n• Uses the mean only\n• \\(P(X \\ge a) \\le \\frac{E[X]}{a}\\)\n\nChebyshev\n• Applies to any X with finite variance\n• Uses the mean and the variance\n• \\(P(\\lvert X - \\mu \\rvert \\ge k\\sigma ) \\le \\frac{1}{k^{2}}\\)"},{"i":"S2.05.f01","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Relation between the PDF and the CDF","b":"\\(f(x)=F'(x), F(x)=\\int_{-\\inf }^{x} f\\)"},{"i":"S2.05.f02","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"\\(P(a < X \\le b)\\) in terms of the CDF","b":"\\(F(b)-F(a)\\)"},{"i":"S2.05.f03","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Standardising a normal variable","b":"\\(Z=\\frac{X-\\mu }{\\sigma }\\)"},{"i":"S2.05.f04","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Symmetry identity for the standard normal CDF","b":"\\(\\Phi (-z)=1-\\Phi (z)\\)"},{"i":"S2.05.f05","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"\\(\\operatorname{Exponential}(\\lambda )\\): give the PDF, CDF, mean and variance","b":"\\(f=\\lambda e^{-\\lambda x}; F=1-e^{-\\lambda x}\\); mean \\(\\frac{1}{\\lambda }\\); var \\(\\frac{1}{\\lambda ^{2}}\\)"},{"i":"S2.05.f06","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Uniform(a,b): give the mean and variance","b":"mean \\(\\frac{a+b}{2}\\), var \\(\\frac{(b-a)^{2}}{12}\\)"},{"i":"S2.05.f07","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"Distribution of aX + b when X ~ \\(N(\\mu , \\sigma ^{2})\\)","b":"\\(N(a \\mu +b, a^{2} \\sigma ^{2})\\)"},{"i":"S2.05.f08","c":"S2.05","k":"S2","y":3,"t":"FORMULA","f":"The empirical rule percentages for 1, 2 and 3 sigma","b":"68%, 95%, 99.7%"},{"i":"S2.05.ch01","c":"S2.05","k":"S2","y":3,"t":"CHAIN","f":"The CDF method for \\(Y = g(X)\\)","b":"1. Write \\(F_{Y}(y) = P(g(X) \\le y)\\)\n2. Solve the inequality for X to express the event via \\(F_{X}\\)\n3. Differentiate to obtain \\(f_{Y}(y) = \\frac{dF_{Y}}{dy}\\)"},{"i":"S2.05.c01","c":"S2.05","k":"S2","y":3,"t":"CLASSIFY","f":"The only continuous distribution that is memoryless is the…","b":"exponential"},{"i":"S2.05.c02","c":"S2.05","k":"S2","y":3,"t":"CLASSIFY","f":"The discrete counterpart of memorylessness belongs to the…","b":"geometric"},{"i":"S2.05.t01","c":"S2.05","k":"S2","y":3,"t":"TRAP","f":"A density f(x) can never exceed 1.","b":"FALSE — the density is not a probability — only the area under it is"},{"i":"S2.05.t02","c":"S2.05","k":"S2","y":3,"t":"TRAP","f":"For continuous \\(X, P(X = c) = 0\\) for every single point c.","b":"TRUE — tX}]\\)"},{"i":"S2.08.f02","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Getting the k-th moment from the MGF","b":"\\(E[X^{k}]=M^{(k)}(0)\\)"},{"i":"S2.08.f03","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Variance from the MGF","b":"\\(M''(0)-[M'(0)]^{2}\\)"},{"i":"S2.08.f04","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"MGF of aX + b","b":"\\(e^{bt}M_{X}(at)\\)"},{"i":"S2.08.f05","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"MGF of a sum of independent variables","b":"\\(M_{X}(t)M_{Y}(t)\\)"},{"i":"S2.08.f06","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"The CLT statement for the standardised sample mean","b":"\\(\\frac{\\bar{X}-\\mu }{\\frac{\\sigma}{\\sqrt{n}}} \\to N(0,1)\\) in distribution"},{"i":"S2.08.f07","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Continuity correction for \\(P(X \\le k)\\) when approximating a discrete variable","b":"\\(P(Y\\le k+0.5)\\)"},{"i":"S2.08.f08","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"The four normal-sampling results — name the distribution of \\(\\frac{(n-1)S^{2}}{\\sigma ^{2}}\\)","b":"chi-squared with n-1 df"},{"i":"S2.08.f09","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Distribution of \\(\\frac{\\bar{X} - \\mu }{\\frac{S}{\\sqrt{n}}}\\) when sampling from a normal","b":"t with n-1 df"},{"i":"S2.08.f10","c":"S2.08","k":"S2","y":3,"t":"FORMULA","f":"Distribution of the ratio \\(\\frac{S_{1}\\frac{^{2}}{\\sigma }_{1}^{2}}{S_{2}\\frac{^{2}}{\\sigma }_{2}^{2}}\\)","b":"F with \\(n_{1}-1\\) and \\(n_{2}-1 df\\)"},{"i":"S2.08.c01","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"The CLT assumes what about the parent distribution?","b":"only a finite variance"},{"i":"S2.08.c02","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"\\(\\bar{X}\\) and \\(S^{2}\\) are independent when sampling from which distribution?","b":"the normal — and it is unique in this"},{"i":"S2.08.c03","c":"S2.08","k":"S2","y":3,"t":"CLASSIFY","f":"\\(\\chi ^{2}_{k}\\) has mean and variance…","b":"k and 2k"},{"i":"S2.08.c04","c":"S2.08","k":"S2","y":3,"t" ","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"Power increases with all of these EXCEPT…","b":"smaller \\(\\alpha\\)"},{"i":"S2.12.c04","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"\\(H_{0}\\) always contains…","b":"equality"},{"i":"S2.12.dsc01","c":"S2.12","k":"S2","y":3,"t":"DISCRIM","f":"Type I error  \\(\\leftrightarrow\\)  Type II error","b":"Type I error\n• Rejecting a true \\(H_{0}\\)\n• Probability \\(\\alpha\\)\n• Controlled by the significance level\n• A false positive\n\nType II error\n• Failing to reject a false \\(H_{0}\\)\n• Probability \\(\\beta\\)\n• Its complement is the power\n• A false negative"},{"i":"S2.12.t01","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"The p-value is the probability that \\(H_{0}\\) is true.","b":"FALSE — it is computed ASSUMING \\(H_{0}\\), and is not P(H₀ | data)"},{"i":"S2.12.t02","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"“Fail to reject \\(H_{0}\\)” means \\(H_{0}\\) is accepted as true.","b":"FALSE — absence of evidence is not evidence of absence"},{"i":"S2.12.t03","c":"S2.12","k":"S2","y":3,"t":"TRAP","f":"A statistically significant result is practically important.","b":"FALSE — a huge n makes trivial effects significant"},{"i":"S2.12.c05","c":"S2.12","k":"S2","y":3,"t":"CLASSIFY","f":"A two-tailed test of \\(\\mu = \\mu _{0}\\) at level \\(\\alpha\\) rejects exactly when…","b":"\\(\\mu _{0}\\) falls outside the \\(100(1-\\alpha )\\% CI\\)"},{"i":"S2.13.f01","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"One-sample z statistic","b":"\\(z=\\frac{\\bar{x}-\\mu_{0}}{\\frac{\\sigma}{\\sqrt{n}}}\\)"},{"i":"S2.13.f02","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"One-sample t statistic and its df","b":"\\(t=\\frac{\\bar{x}-\\mu_{0}}{\\frac{s}{\\sqrt{n}}}, df=n-1\\)"},{"i":"S2.13.f03","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Pooled variance \\(s_{p}^{2}\\) for the two-sample t","b":"\\(\\frac{(n_{1}-1)s_{1}^{2}+(n_{2}-1)s_{2}^{2}}{n_{1}+n_{2}-2}\\)"},{"i":"S2.13.f04","c":"S2.13","k":"S2","y":3,"t":"FORMULA","f":"Pooled /* ─────────────────────────────────────────────────────────────────────
   Foundation Flashcards
   471 cards drawn from the Foundation Theory Handbook (all 43 clauses).
   Formulas are LaTeX, typeset by MathJax exactly as in the handbook.
   State lives in localStorage on this device only.
   ───────────────────────────────────────────────────────────────────── */

const KEY = 'foundation.flashcards.v1';
const COURSE_NAME = { M1:'Mathematics I', S1:'Statistics I', M2:'Mathematics II', S2:'Statistics II', AP:'Appendix' };

let known = {};
try { known = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ known = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch(e){} };

const $ = s => document.querySelector(s);
let queue = [], pos = 0, flipped = false;

/* ── deck building ─────────────────────────────────────────────────── */
function pool(){
  const c = $('#course').value, cl = $('#clause').value;
  return CARDS.filter(x => (c === 'ALL' || x.k === c) && (cl === 'ALL' || x.c === cl));
}
function build(keepPos){
  const m = $('#mode').value;
  let q = pool();
  if(m === 'new')   q = q.filter(x => !known[x.i]);
  if(m === 'known') q = q.filter(x =>  known[x.i]);
  queue = q;
  pos = keepPos ? Math.min(pos, Math.max(0, queue.length - 1)) : 0;
  flipped = false;
  render();
}
function shuffle(){
  for(let i = queue.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  pos = 0; flipped = false; render();
}

/* ── clause dropdown, rebuilt whenever the course changes ──────────── */
function fillClauses(){
  const c = $('#course').value;
  const seen = [];
  CARDS.forEach(x => { if((c === 'ALL' || x.k === c) && seen.indexOf(x.c) < 0) seen.push(x.c); });
  seen.sort();
  $('#clause').innerHTML = '<option value="ALL">All clauses</option>' +
    seen.map(x => '<option value="' + x + '">' + x + '</option>').join('');
}

/* ── progress reflects the whole filtered deck, not the session ────── */
function progress(){
  const p = pool();
  const k = p.filter(x => known[x.i]).length;
  $('#progFill').style.width = (p.length ? Math.round(100 * k / p.length) : 0) + '%';
  $('#progPct').textContent = k + ' / ' + p.length;
  const c = $('#course').value;
  $('#progLabel').textContent = (c === 'ALL' ? 'all courses' : COURSE_NAME[c]) + ' — known';
}

/* ── rendering ─────────────────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
}

/* MathJax is loaded async and re-runs on every card. typesetClear drops the
   state of the nodes we are about to replace, so it does not leak. */
function typeset(el){
  if(!window.__mjReady || !window.MathJax || !MathJax.typesetPromise) return;  // re-runs on ready
  MathJax.startup.promise = MathJax.startup.promise
    .then(() => { try { MathJax.typesetClear([el]); } catch(e){} return MathJax.typesetPromise([el]); })
    .catch(() => {});
}

function render(){
  progress();
  const stage = $('#stage');

  if(!queue.length){
    const m = $('#mode').value;
    stage.innerHTML =
      '<div class="done"><h2>' +
      (m === 'new' ? 'Nothing left to learn here.' : 'No cards match.') + '</h2><p>' +
      (m === 'new'
        ? 'Every card in this selection is marked known. Switch to “Every card” to review them, or pick another course.'
        : 'Try a different course, clause, or study mode.') +
      '</p></div>';
    return;
  }

  if(pos < 0 || pos >= queue.length) pos = 0;   // never render off the end
  const card = queue[pos];
  const isKnown = !!known[card.i];

  /* An answer that is nothing but one expression is set as display maths, so
     fractions, sums and radicals come out full size instead of squeezed to
     inline height. Mixed prose-and-maths answers stay inline. */
  const whole = /^\\\((.*)\\\)$/s.exec(card.b);
  const backText = whole ? '\\[' + whole[1] + '\\]' : card.b;

  let html =
    '<div class="card" id="cardEl">' +
      '<div class="card-head">' +
        '<span class="tag">' + esc(card.t) + '</span>' +
        '<span class="clause">' + esc(card.c) + '</span>' +
        (isKnown ? '<span class="known-dot">✓ known</span>' : '') +
      '</div>' +
      '<p class="front">' + esc(card.f) + '</p>' +
      (flipped
        ? '<div class="divider"></div><div class="back' + (whole ? ' back-display' : '') + '">' +
          esc(backText) + '</div>'
        : '<div class="hint">click, or press space, to reveal</div>') +
    '</div>' +
    '<div class="actions">' +
      (flipped
        ? '<button class="btn btn-again" id="again">Again</button>' +
          '<button class="btn btn-got" id="got">Got it</button>'
        : '<button class="btn btn-flip" id="flip">Reveal answer</button>') +
    '</div>' +
    '<div class="nav">' +
      '<button class="btn" id="prev" aria-label="Previous card">←</button>' +
      '<button class="btn" id="next" aria-label="Next card">→</button>' +
      '<span class="counter">' + (pos + 1) + ' of ' + queue.length + '</span>' +
    '</div>';

  stage.innerHTML = html;
  typeset(stage);

  $('#cardEl').onclick = () => { flipped = !flipped; render(); };
  const f = $('#flip');  if(f) f.onclick = e => { e.stopPropagation(); flipped = true; render(); };
  const a = $('#again'); if(a) a.onclick = e => { e.stopPropagation(); mark(false); };
  const g = $('#got');   if(g) g.onclick = e => { e.stopPropagation(); mark(true);  };
  $('#prev').onclick = () => move(-1);
  $('#next').onclick = () => move(1);
}

function move(d){
  if(!queue.length) return;
  pos = (pos + d + queue.length) % queue.length;
  flipped = false;
  render();
}

/* "Again" keeps the card in rotation, pushed a few places back so it
   returns within the same sitting. "Got it" marks it known; in the
   default study mode that also retires it from the queue. */
function mark(ok){
  const card = queue[pos];
  if(ok){
    known[card.i] = 1;
    save();
    if($('#mode').value === 'new'){
      queue.splice(pos, 1);
      if(pos >= queue.length) pos = 0;
      flipped = false;
      return render();
    }
  } else {
    delete known[card.i];
    save();
    if(queue.length > 2){
      const [c] = queue.splice(pos, 1);
      queue.splice(Math.min(pos + 5, queue.length), 0, c);
      flipped = false;
      if(pos >= queue.length) pos = 0;
      return render();
    }
  }
  move(1);
}

/* ── wiring ────────────────────────────────────────────────────────── */
$('#course').onchange = () => { fillClauses(); build(); };
$('#clause').onchange = () => build();
$('#mode').onchange   = () => build();
$('#shuffle').onclick = shuffle;
$('#reset').onclick = () => {
  if(!confirm('Clear every “known” mark on this device? This cannot be undone.')) return;
  known = {}; save(); build();
};

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k === ' '){ e.preventDefault(); flipped = !flipped; render(); }
  else if(k === 'ArrowRight') move(1);
  else if(k === 'ArrowLeft')  move(-1);
  else if(k === '1'){ if(flipped) mark(false); }
  else if(k === '2'){ if(flipped) mark(true); }
  else if(k === 's' || k === 'S') shuffle();
});

/* ── theme ─────────────────────────────────────────────────────────── */
(function theme(){
  const TK = 'foundation.flashcards.theme';
  const set = t => {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(TK, t); } catch(e){}
    $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark';
  };
  let saved = null;
  try { saved = localStorage.getItem(TK); } catch(e){}
  set(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#theme').onclick = () =>
    set(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
})();

window.__onMathJaxReady = () => render();

fillClauses();
build();
</script>
</body>
</html>
