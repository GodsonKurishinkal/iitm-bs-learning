:"AP","y":3,"t":"FORMULA","f":"Variance of Gamma(α,β)","b":"α/β^2"},{"i":"A.01.vBeta.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Beta(α,β)","b":"α/(α+β)"},{"i":"A.01.vBeta.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of Beta(α,β)","b":"αβ/((α+β)²(α+β+1))"},{"i":"A.01.vk.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of χ²_k","b":"k"},{"i":"A.01.vk.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of χ²_k","b":"2k"},{"i":"A.01.vtk.mean","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of t_k","b":"0  (k>1)"},{"i":"A.01.vtk.var","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of t_k","b":"k/(k-2)  (k>2)"},{"i":"A.01.c01","c":"A.01","k":"AP","y":3,"t":"CLASSIFY","f":"Which distribution has mean equal to its variance?","b":"Poisson(λ)"},{"i":"A.01.c02","c":"A.01","k":"AP","y":3,"t":"CLASSIFY","f":"Mean and variance of χ²_k are…","b":"k and 2k"},{"i":"A.01.c03","c":"A.01","k":"AP","y":3,"t":"CLASSIFY","f":"Variance of Geometric(p) is…","b":"(1−p)/p²"},{"i":"A.01.c04","c":"A.01","k":"AP","y":3,"t":"CLASSIFY","f":"The t_k distribution’s MGF…","b":"does not exist"},{"i":"A.01.c05","c":"A.01","k":"AP","y":3,"t":"CLASSIFY","f":"Which models sampling WITHOUT replacement?","b":"Hypergeometric"},{"i":"A.01.f01","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"MGF of the Normal(μ, σ²)","b":"e^(mu t+sigma^2 t^2/2)"},{"i":"A.01.f02","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean and variance of Gamma(α, β)","b":"alpha/beta and alpha/beta^2"},{"i":"A.01.f03","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Mean of Beta(α, β)","b":"alpha/(alpha+beta)"},{"i":"A.01.f04","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"χ²_k written as a Gamma distribution","b":"Gamma(k/2,1/2)"},{"i":"A.01.f05","c":"A.01","k":"AP","y":3,"t":"FORMULA","f":"Variance of t_k, and when it exists","b":"k/(k-2) for k>2"},{"i":"A.02.c01","c":"A.02","k":"AP","y":3,"t":"CLASSIFY","f":"Mean, σ unknown, normal population → which test?","b":"one-sample t, df n−1"},{"i":"A.02.c02","c":"A.02","k":"AP","y":3,"t":"CLASSIFY","f":"Two independent groups, unequal variances → which test?","b":"Welch t"},{"i":"A.02.c03","c":"A.02","k":"AP","y":3,"t":"CLASSIFY","f":"Same units measured twice → which test?","b":"paired t, df n−1"},{"i":"A.02.c04","c":"A.02","k":"AP","y":3,"t":"CLASSIFY","f":"Are two variances equal? → which test and df?","b":"F, df (n₁−1, n₂−1)"},{"i":"A.02.c05","c":"A.02","k":"AP","y":3,"t":"CLASSIFY","f":"Are two categorical variables related? → which df?","b":"(r−1)(c−1)"},{"i":"A.03.dsc01","c":"A.03","k":"AP","y":1,"t":"DISCRIM","f":"Population (parameter)  ⟷  Sample (statistic)","b":"Population (parameter)\n• μ\n• σ²\n• p\n• ρ\n• N\n\nSample (statistic)\n• x̄\n• s²\n• p̂\n• r\n• n"},{"i":"A.03.c01","c":"A.03","k":"AP","y":1,"t":"CLASSIFY","f":"N(A) and C(A) denote…","b":"null space and column space"},{"i":"A.03.c02","c":"A.03","k":"AP","y":1,"t":"CLASSIFY","f":"The symbol ⟶d means…","b":"converges in distribution"},{"i":"A.03.c03","c":"A.03","k":"AP","y":1,"t":"CLASSIFY","f":"⊥ is read as…","b":"orthogonal to / independent of"},{"i":"A.03.c04","c":"A.03","k":"AP","y":1,"t":"CLASSIFY","f":"z_α denotes…","b":"the upper α critical value"},{"i":"A.03.c05","c":"A.03","k":"AP","y":1,"t":"CLASSIFY","f":"ker T and im T are…","b":"the kernel and image of a transformation"}]

/* ─────────────────────────────────────────────────────────────────────
   Foundation Flashcards
   471 cards drawn from the Foundation Theory Handbook (all 43 clauses).
   State lives in localStorage on this device only.
   ───────────────────────────────────────────────────────────────────── */

const KEY = 'foundation.flashcards.v1';
const COURSE_NAME = { M1:'Mathematics I', S1:'Statistics I', M2:'Mathematics II', S2:'Statistics II', AP:'Appendix' };

let known = {};
try { known = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ known = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch(e){} };

const $ = s => document.querySelector(s);
let queue = [], pos = 0, flipped = false;

/* ── deck building ─────────────────────────────────────────────────── */
function pool(){
  const c = $('#course').value, cl = $('#clause').value;
  return CARDS.filter(x => (c === 'ALL' || x.k === c) && (cl === 'ALL' || x.c === cl));
}
function build(keepPos){
  const m = $('#mode').value;
  let q = pool();
  if(m === 'new')   q = q.filter(x => !known[x.i]);
  if(m === 'known') q = q.filter(x =>  known[x.i]);
  queue = q;
  pos = keepPos ? Math.min(pos, Math.max(0, queue.length - 1)) : 0;
  flipped = false;
  render();
}
function shuffle(){
  for(let i = queue.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  pos = 0; flipped = false; render();
}

/* ── clause dropdown, rebuilt whenever the course changes ──────────── */
function fillClauses(){
  const c = $('#course').value;
  const seen = [];
  CARDS.forEach(x => { if((c === 'ALL' || x.k === c) && seen.indexOf(x.c) < 0) seen.push(x.c); });
  seen.sort();
  const sel = $('#clause');
  sel.innerHTML = '<option value="ALL">All clauses</option>' +
    seen.map(x => '<option value="' + x + '">' + x + '</option>').join('');
}

/* ── progress reflects the whole filtered deck, not the session ────── */
function progress(){
  const p = pool();
  const k = p.filter(x => known[x.i]).length;
  const pct = p.length ? Math.round(100 * k / p.length) : 0;
  $('#progFill').style.width = pct + '%';
  $('#progPct').textContent = k + ' / ' + p.length;
  const c = $('#course').value;
  $('#progLabel').textContent = (c === 'ALL' ? 'all courses' : COURSE_NAME[c]) + ' — known';
}

/* ── rendering ─────────────────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
}
function render(){
  progress();
  const stage = $('#stage');

  if(!queue.length){
    const m = $('#mode').value;
    stage.innerHTML =
      '<div class="done"><h2>' +
      (m === 'new' ? 'Nothing left to learn here.' : 'No cards match.') + '</h2><p>' +
      (m === 'new'
        ? 'Every card in this selection is marked known. Switch to “Every card” to review them, or pick another course.'
        : 'Try a different course, clause, or study mode.') +
      '</p></div>';
    return;
  }

  if(pos < 0 || pos >= queue.length) pos = 0;   // never render off the end
  const card = queue[pos];
  const isKnown = !!known[card.i];
  let html =
    '<div class="card" id="cardEl">' +
      '<div class="card-head">' +
        '<span class="badge">' + esc(card.t) + '</span>' +
        '<span class="clause">' + esc(card.c) + '</span>' +
        (isKnown ? '<span class="known-dot">✓ known</span>' : '') +
      '</div>' +
      '<p class="front">' + esc(card.f) + '</p>';
  if(flipped){
    html += '<div class="divider"></div><p class="back">' + esc(card.b) + '</p>';
  } else {
    html += '<div class="hint">click, or press space, to reveal</div>';
  }
  html += '</div>';

  html += '<div class="actions">';
  if(flipped){
    html += '<button class="btn btn-again" id="again">Again</button>' +
            '<button class="btn btn-got" id="got">Got it</button>';
  } else {
    html += '<button class="btn btn-flip" id="flip">Reveal answer</button>';
  }
  html += '</div>';

  html += '<div class="nav">' +
            '<button class="btn" id="prev">←</button>' +
            '<button class="btn" id="next">→</button>' +
            '<span class="counter">' + (pos + 1) + ' of ' + queue.length + '</span>' +
          '</div>';

  stage.innerHTML = html;

  $('#cardEl').onclick = () => { flipped = !flipped; render(); };
  const f = $('#flip');  if(f) f.onclick = e => { e.stopPropagation(); flipped = true; render(); };
  const a = $('#again'); if(a) a.onclick = e => { e.stopPropagation(); mark(false); };
  const g = $('#got');   if(g) g.onclick = e => { e.stopPropagation(); mark(true);  };
  $('#prev').onclick = () => move(-1);
  $('#next').onclick = () => move(1);
}

function move(d){
  if(!queue.length) return;
  pos = (pos + d + queue.length) % queue.length;
  flipped = false;
  render();
}

/* "Again" keeps the card in rotation, pushed a few places back so it
   returns within the same sitting. "Got it" marks it known; in the
   default study mode that also retires it from the queue. */
function mark(ok){
  const card = queue[pos];
  if(ok){
    known[card.i] = 1;
    save();
    if($('#mode').value === 'new'){
      queue.splice(pos, 1);
      if(pos >= queue.length) pos = 0;
      flipped = false;
      return render();
    }
  } else {
    delete known[card.i];
    save();
    if(queue.length > 2){
      const [c] = queue.splice(pos, 1);
      queue.splice(Math.min(pos + 5, queue.length), 0, c);
      flipped = false;
      if(pos >= queue.length) pos = 0;
      return render();
    }
  }
  move(1);
}

/* ── wiring ────────────────────────────────────────────────────────── */
$('#course').onchange = () => { fillClauses(); build(); };
$('#clause').onchange = () => build();
$('#mode').onchange   = () => build();
$('#shuffle').onclick = shuffle;
$('#reset').onclick = () => {
  if(!confirm('Clear every “known” mark on this device? This cannot be undone.')) return;
  known = {}; save(); build();
};

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(k === ' '){ e.preventDefault(); flipped = !flipped; render(); }
  else if(k === 'ArrowRight') move(1);
  else if(k === 'ArrowLeft')  move(-1);
  else if(k === '1'){ if(flipped) mark(false); }
  else if(k === '2'){ if(flipped) mark(true); }
  else if(k === 's' || k === 'S') shuffle();
});

/* ── theme ─────────────────────────────────────────────────────────── */
(function theme(){
  const TK = 'foundation.flashcards.theme';
  const set = t => {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(TK, t); } catch(e){}
    $('#theme').textContent = t === 'dark' ? '🌙' : '☀️';
  };
  let saved = null;
  try { saved = localStorage.getItem(TK); } catch(e){}
  set(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#theme').onclick = () =>
    set(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
})();

fillClauses();
build();
</script>
</body>
</html>
